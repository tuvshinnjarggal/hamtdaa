<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Найзууд, хосууд, гэр бүлээрээ нэг утсаар тоглох монгол тоглоомууд.">
<title>Хамтдаа</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one-screen app, a single centred column (max 460px) that swaps views; each mood tints the room with its own candle glow. Deliberately one dark "evening" look. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --night:#14111f;
  --night-2:#1e1a2e;
  --line:#3a3350;
  --ink:#f3eefa;
  --ink-soft:#b7aecb;
  --glow:#f2b45a;          /* changes per mood */
  --glow-ink:#2a1a05;
  --rose:#ff7a9c; --amber:#f2b45a; --teal:#5fd3c0; --lilac:#b49cff;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.view{min-height:0}
.wh-names{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wh-names .chip{color:var(--ink);font-size:15px}
.wh-q{font-family:var(--display);font-weight:500;font-size:clamp(20px,5.8vw,25px);line-height:1.4;text-align:center;text-wrap:balance}
.coin{font-size:64px;line-height:1;display:inline-block}
.coin.spin{animation:coinspin .9s ease-out}
@keyframes coinspin{from{transform:rotateY(0)}to{transform:rotateY(1440deg)}}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 45% at 50% 0%,color-mix(in srgb,var(--glow) 28%,transparent),transparent 70%);
  transition:background .6s}
#app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;padding-block:20px 28px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
.view{display:flex;flex-direction:column;gap:18px;flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.04em}
.brand b{color:var(--glow)}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 12px 8px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);font-weight:600;font-size:14px}
.back:hover{color:var(--ink);border-color:var(--ink-soft)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;line-height:1.8;display:inline-block;overflow:visible;padding-block:2px}
.hero h1{font-size:clamp(28px,8vw,38px)}
.hero p{color:var(--ink-soft);margin:8px 0 0}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mood{position:relative;text-align:left;padding:16px 14px 14px;border-radius:20px;background:var(--night-2);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:6px;min-height:150px;overflow:hidden;transition:transform .2s,border-color .2s}
.mood:hover{transform:translateY(-2px);border-color:var(--c)}
.mood::before{content:"";position:absolute;width:120px;height:120px;right:-40px;top:-40px;border-radius:50%;background:var(--c);opacity:.22;filter:blur(8px)}
.mood .ic{font-size:28px;line-height:1}
.mood h3{font-size:15px;margin-top:auto}
.mood small{color:var(--ink-soft);font-size:13px;line-height:1.35}
.note{font-size:13px;color:var(--ink-soft);text-align:center;margin-top:auto}
.games{display:flex;flex-direction:column;gap:12px}
.game{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:18px;background:var(--night-2);border:1px solid var(--line)}
.game:hover{border-color:var(--glow)}
.game .ic{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--glow) 18%,transparent)}
.game div{min-width:0}
.game h3{font-size:15px}
.game p{margin:2px 0 0;color:var(--ink-soft);font-size:14px;line-height:1.35}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--glow);color:var(--glow-ink);margin-left:6px;vertical-align:2px}
.tabs{display:flex;gap:6px;padding:4px;border-radius:999px;background:var(--night-2);border:1px solid var(--line)}
.tabs button{flex:1;padding:9px 6px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{background:var(--glow);color:var(--glow-ink)}
.stage{perspective:1200px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:min(340px,42dvh)}
.card{position:relative;width:100%;aspect-ratio:3/4;max-height:min(380px,55vh);margin:0 auto;max-width:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;padding:26px 22px}
.front{background:
  repeating-linear-gradient(45deg,color-mix(in srgb,var(--glow) 14%,transparent) 0 2px,transparent 2px 14px),
  linear-gradient(160deg,var(--night-2),var(--night));border:1px solid color-mix(in srgb,var(--glow) 50%,var(--line));align-items:center;justify-content:center;gap:10px;text-align:center}
.front .big{font-family:var(--display);font-size:56px;color:var(--glow);line-height:1}
.front span{color:var(--ink-soft);font-weight:600}
.back-face{transform:rotateY(180deg);background:var(--ink);color:#1b1528;justify-content:space-between}
.back-face .kind{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7a6c92}
.back-face .q{font-family:var(--display);font-weight:500;font-size:clamp(20px,5.6vw,25px);line-height:1.35;text-wrap:balance}
.back-face .foot{display:flex;justify-content:space-between;font-size:13px;color:#7a6c92;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px}
.btn{flex:1;padding:15px 18px;border-radius:16px;font-weight:800;font-size:16px;text-align:center;background:var(--glow);color:var(--glow-ink);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--teal);color:#062622}
.btn.skip{background:#3a3350;color:var(--ink)}
.panel{background:var(--night-2);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper .ctl{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);font-size:22px;font-weight:800}
.stepper output{font-family:var(--display);font-size:22px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.rules{margin:0;padding-left:20px;color:var(--ink-soft);font-size:14px;display:flex;flex-direction:column;gap:4px}
.reveal{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;border-radius:26px;border:1px dashed var(--line);padding:28px 18px;min-height:min(320px,42dvh)}
.reveal .who{font-family:var(--display);font-size:30px}
.reveal .word{font-family:var(--display);font-size:clamp(30px,9vw,44px);color:var(--glow)}
.reveal p{color:var(--ink-soft);margin:0}
.timer{font-family:var(--display);font-size:64px;text-align:center;font-variant-numeric:tabular-nums;color:var(--glow);line-height:1}
.timer.low{color:var(--rose)}
.hu-word{flex:1;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:clamp(34px,11vw,54px);border-radius:26px;background:var(--ink);color:#1b1528;padding:24px;min-height:min(260px,36dvh);text-wrap:balance}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{padding:16px 12px;border-radius:16px;background:var(--night-2);border:1px solid var(--line);font-weight:800;text-align:left;display:flex;flex-direction:column;gap:4px}
.cat:hover{border-color:var(--glow)}
.cat span{font-size:24px}
.cat small{color:var(--ink-soft);font-weight:600}
.results{display:flex;flex-wrap:wrap;gap:6px}
.results span{padding:4px 10px;border-radius:999px;font-size:14px;font-weight:700;background:color-mix(in srgb,var(--teal) 20%,transparent)}
.results span.x{background:#2b2640;color:var(--ink-soft);text-decoration:line-through}
.gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,8,16,.82);backdrop-filter:blur(6px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.gate .panel{max-width:380px;text-align:center}
.gate h2{font-size:22px}
.gate p{margin:0;color:var(--ink-soft)}
.spylist{display:flex;flex-direction:column;gap:6px;font-weight:700}
.spylist div{display:flex;justify-content:space-between;padding:8px 12px;border-radius:12px;background:var(--night)}
.spylist .spy{color:var(--rose)}
.bomb{width:min(220px,60vw);aspect-ratio:1;max-width:100%;margin:8px auto;border-radius:50%;display:grid;place-items:center;font-size:84px;
  background:radial-gradient(circle at 35% 30%,#4a4160,#1a1626 70%);box-shadow:0 0 0 6px color-mix(in srgb,var(--glow) 30%,transparent),0 0 60px color-mix(in srgb,var(--glow) 40%,transparent);animation:pulse var(--beat,.9s) ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.prompt{text-align:center;font-family:var(--display);font-size:clamp(22px,6.5vw,30px);text-wrap:balance}
.boom{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--rose);color:#2b0610;text-align:center;font-family:var(--display);animation:flash .5s ease-out}
.boom div{font-size:clamp(44px,14vw,72px)}
.boom p{font-family:var(--body);font-weight:800;font-size:18px;margin:8px 0 0}
@keyframes flash{from{background:#fff}}
.names{display:flex;flex-direction:column;gap:8px}
.names .nm{display:flex;gap:8px}
.names input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--night);color:var(--ink);font:inherit}
.names input:focus{outline:2px solid var(--glow);border-color:transparent}
.names .rm{width:44px;border-radius:12px;border:1px solid var(--line);color:var(--ink-soft);font-size:20px}
.mission{font-family:var(--display);font-weight:500;font-size:clamp(19px,5.4vw,23px);line-height:1.4;text-wrap:balance}
.target{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--glow);color:var(--glow-ink);font-weight:800}
.mlist{display:flex;flex-direction:column;gap:10px}
.mitem{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:16px;background:var(--night-2);border:1px solid var(--line)}
.mitem[aria-pressed="true"]{border-color:var(--teal)}
.mitem .ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800}
.mitem[aria-pressed="true"] .ck{background:var(--teal);border-color:var(--teal);color:#062622}
.mitem div{min-width:0}.mitem b{display:block}.mitem small{color:var(--ink-soft);font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:18px 12px;border-radius:16px;background:var(--night-2);border:1px solid var(--line);font-weight:800;font-size:16px}
.opt:hover{border-color:var(--glow)}
.opt.right{background:var(--teal);color:#062622;border-color:var(--teal)}
.opt.wrong{background:#4a2433;border-color:var(--rose)}
.pct{font-family:var(--display);font-size:72px;color:var(--glow);text-align:center;line-height:1}
.qline{font-family:var(--display);font-size:clamp(20px,5.8vw,26px);text-align:center;text-wrap:balance}
.who-line{text-align:center;color:var(--ink-soft);font-weight:700}
.touchpad{position:fixed;inset:0;z-index:15;background:var(--night);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.touchpad .hint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 70px);text-align:center;padding-inline:24px;color:var(--ink-soft);font-weight:700;pointer-events:none}
.touchpad .hint b{display:block;font-family:var(--display);font-size:24px;color:var(--ink);margin-bottom:6px}
.touchpad .close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));z-index:2}
.dot{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:6px solid var(--c);background:color-mix(in srgb,var(--c) 25%,transparent);pointer-events:none;transition:transform .4s,opacity .4s;animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.12)}}
.dot.win{animation:none;transform:scale(2.6);background:var(--c)}
.dot.lose{animation:none;opacity:0;transform:scale(.4)}
.shagai-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bone{aspect-ratio:3/4;max-width:100%;border-radius:40% 40% 34% 34%/30% 30% 44% 44%;background:linear-gradient(160deg,#f6ead6,#d9c3a0);color:#3b2a14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.bone span{font-size:30px;line-height:1}.bone small{font-weight:800;font-size:13px}
.bone.roll{animation:roll .5s ease-in-out}
@keyframes roll{25%{transform:translateY(-18px) rotate(-30deg)}60%{transform:translateY(4px) rotate(25deg)}}
.cup.shake{animation:shake .45s ease-in-out}
@keyframes shake{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.verdict{text-align:center;font-family:var(--display);font-size:22px;min-height:1.4em;text-wrap:balance}
.hist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.hist span{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--night-2);border:1px solid var(--line);color:var(--ink-soft)}
.dial{width:100%;max-width:100%;display:block;touch-action:none}
.dial .arc{fill:var(--night-2);stroke:var(--line);stroke-width:2}
.dial text{fill:var(--ink-soft);font:700 13px var(--body)}
.spectrum{display:flex;justify-content:space-between;gap:12px;font-weight:800}
.spectrum span{max-width:45%}.spectrum span:last-child{text-align:right}
.range{width:100%;accent-color:var(--glow)}
.pkmodes{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;justify-content:center;gap:6px;padding-inline:16px;z-index:2}
.pkmodes button{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--night-2);font-weight:800;font-size:14px;color:var(--ink-soft)}
.pkmodes button[aria-pressed="true"]{background:var(--glow);color:var(--glow-ink);border-color:var(--glow)}
.tdcard{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:3;max-width:420px;margin:0 auto}
.dot .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--night)}
.stakes{display:flex;flex-direction:column;gap:10px}
.stakes .chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--night-2);font-weight:800;font-size:14px;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--glow);color:var(--glow-ink);border-color:var(--glow)}
.penalty{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;background:color-mix(in srgb,var(--glow) 16%,var(--night-2));border:1px solid var(--glow);text-align:left}
.penalty b{font-family:var(--display);font-weight:500;font-size:18px;line-height:1.35}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--glow)}
.gaze{width:min(240px,64vw);aspect-ratio:1;max-width:100%;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:64px;color:var(--glow);
  background:radial-gradient(circle,color-mix(in srgb,var(--glow) 22%,transparent),transparent 70%);border:2px solid color-mix(in srgb,var(--glow) 60%,transparent);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
.reels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reel{border-radius:20px;background:var(--ink);color:#1b1528;padding:22px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;min-height:130px;justify-content:center}
.reel small{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7a6c92}
.reel b{font-family:var(--display);font-size:clamp(20px,6vw,26px);font-weight:700}
.reel.spin b{filter:blur(1.5px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<div id="gate" class="gate" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <h2 id="gateTitle">Зөвхөн 18+ насныханд</h2>
    <p>Энэ хэсэг хосуудад зориулсан романтик, халуун асуулт, даалгавартай. Та 18 нас хүрсэн үү?</p>
    <div class="row">
      <button class="btn ghost" id="gateNo">Буцах</button>
      <button class="btn" id="gateYes">Тийм, 18+</button>
    </div>
  </div>
</div>

<script>
const MOODS = {
  couples:{name:"Хосуудын орой", ic:"💞", c:"var(--rose)", sub:"Дулаан, ойртуулах яриа", games:["nandin","spicy","wheel","match","wave","picker"]},
  friends:{name:"Найзуудын цугларалт", ic:"🎉", c:"var(--amber)", sub:"Инээд, өрсөлдөөн, сэжиг", games:["whisper","bomb","wave","missions","spy","headsup","shagai","picker"]},
  family:{name:"Гэр бүл, хүүхдүүд", ic:"🏡", c:"var(--teal)", sub:"Бүх насныханд хөгжилтэй", games:["shagai","bomb","charades","familyDeck","picker"], desc:{picker:"Бүгд дэлгэц дээр хуруугаа тавь. Утас хэн эхлэхийг сонгох эсвэл хоёр баг болгон хуваана."}},
  strangers:{name:"Шинэ танилууд", ic:"🤝", c:"var(--lilac)", sub:"Мөс хайлуулах асуултууд", games:["iceDeck","missions","picker"]},
};
const GAMES = {
  whisper:{name:"Шивнээ", ic:"🤫", desc:"Нууц асуултыг ганцаараа уншаад хариулт болох хүний нэрийг чанга хэл. Тэр хүн асуултыг мэдэхийн тулд зоос шидэх үү, шийтгэл хүлээх үү?", tag:"Шинэ"},
  nandin:{name:"Нандин", ic:"🌸", desc:"Гурван үе шаттай орой: бидний эхлэл, хэлж чадаагүй үг, нүд рүү харсан 30 секундын талархал.", tag:"Шинэ"},

let deckState = null;
function deck(id, from, levelIdx=0){
  stopTimer(); setGlow(MOODS[from].c);
  const D = DECKS[id], L = D.levels[levelIdx];
  if(L.adult && !adultOk){ openGate(()=>deck(id,from,levelIdx)); return; }
  deckState = {id, from, levelIdx, order:shuffle(L.items), i:0};
  renderDeck();
}
function renderDeck(){
  const {id,from,levelIdx,order,i} = deckState; const D=DECKS[id], L=D.levels[levelIdx], G=GAMES[id];
  const q = order[i], isTask = q.startsWith("Даалгавар:");
  app.innerHTML = `<section class="view">${topBar("mood:"+from, MOODS[from].name)}
    <h2 style="font-size:22px">${G.ic} ${G.name}</h2>
    ${D.levels.length>1?`<div class="tabs" role="tablist">${D.levels.map((l,n)=>`<button role="tab" aria-selected="${n===levelIdx}" data-level="${n}">${l.name}</button>`).join("")}</div>`:""}

      <div class="face front"><div class="big">?</div><span>Дарж эргүүл</span><span class="eyebrow">${L.name}</span></div>
      <div class="face back-face"><span class="kind">${isTask?"Даалгавар":"Асуулт"} · ${L.name}</span>
        <div class="q">${esc(isTask?q.replace("Даалгавар: ",""):q)}</div>
        <div class="foot"><span>${i+1} / ${order.length}</span><span>${esc(G.name)}</span></div></div>
    </div></div>
    <div class="row"><button class="btn" id="next">${i+1<order.length?"Дараагийн карт":"Дахин холих"}</button></div>
  </section>`;
  const card = document.getElementById("card");
  const flip = () => card.classList.toggle("flipped");
  card.onclick = flip; card.onkeydown = e => { if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();} };
  document.getElementById("next").onclick = () => {
    if(deckState.i+1<deckState.order.length) deckState.i++; else { deckState.order=shuffle(deckState.order); deckState.i=0; }

    requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById("card").classList.add("flipped")));
  };
  app.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>deck(id,from,+b.dataset.level));
}

function wave(from){
  stopTimer(); setGlow(MOODS[from].c);
  let score=0, round=0;
  app.innerHTML=`<section class="view">${topBar("mood:"+from, MOODS[from].name)}
    <h2 style="font-size:22px">📡 Нэг долгион дээр</h2>
    <ol class="rules"><li>Санаа өгөгч утсаа авч нууц цэгийг харна.</li><li>Хоёр туйлын хооронд тэр цэгт тохирох ганц үг, нэр, зүйл хэлнэ. Жишээ нь "Хүйтэн ↔ Халуун" дээр 80% бол "халуун цай".</li><li>Бусад нь ярилцаж зүүг тааруулна. Ойртох тусам оноо их.</li></ol>
    <div class="row" style="margin-top:auto"><button class="btn" id="go">Эхлэх</button></div></section>`;
  document.getElementById("go").onclick=start;
  function dial(target, guess, showTarget){
    const R=140, cx=160, cy=160, pt=(v,r)=>{ const a=Math.PI*(1-v/100); return [cx+r*Math.cos(a), cy-r*Math.sin(a)]; };
    let band="";
    if(showTarget){ [[15,"color-mix(in srgb,var(--glow) 25%,transparent)"],[10,"color-mix(in srgb,var(--glow) 55%,transparent)"],[5,"var(--glow)"]].forEach(([w,c])=>{
      const a=Math.max(0,target-w), b=Math.min(100,target+w), [x1,y1]=pt(a,R), [x2,y2]=pt(b,R);
      band+=`<path d="M${cx} ${cy} L${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2} Z" fill="${c}"/>`; }); }
    let needle="";
    if(guess!=null){ const [nx,ny]=pt(guess,R-14); needle=`<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="9" fill="var(--ink)"/>`; }
    return `<svg class="dial" viewBox="0 0 320 180" id="dial" role="img" aria-label="Хуваарь">
      <path class="arc" d="M${cx-R} ${cy} A${R} ${R} 0 0 1 ${cx+R} ${cy} Z"/>${band}${needle}
      <text x="${cx-R}" y="176">0</text><text x="${cx+R-22}" y="176">100</text></svg>`;
  }
  function start(){
    round++; const sp=SPECTRA[Math.floor(Math.random()*SPECTRA.length)], target=5+Math.floor(Math.random()*91);
    const spec=`<div class="spectrum"><span>← ${esc(sp[0])}</span><span>${esc(sp[1])} →</span></div>`;
    app.innerHTML=`<section class="view">${topBar("mood:"+from, "Зогсоох")}
      <p class="who-line">Тойрог ${round} · Зөвхөн санаа өгөгч хар</p>${spec}${dial(target,null,true)}
      <p class="note" style="margin:0">Нууц цэг: <b style="color:var(--glow)">${target}%</b>. Энэ цэгт тохирох ганц үг сана.</p>
      <div class="row" style="margin-top:auto"><button class="btn" id="hide">Нуугаад дамжуулах</button></div></section>`;
    document.getElementById("hide").onclick=()=>guess(target,spec);
  }
  function guess(target,spec){
    let g=50;
    app.innerHTML=`<section class="view">${topBar("mood:"+from, "Зогсоох")}
      <p class="who-line">Санаа өгөгч үгээ хэлсэн үү? Одоо зүүг тааруул</p>${spec}<div id="dw">${dial(target,g,false)}</div>
      <label for="wr" class="who-line">Зүүний байрлал: <output id="wo">50</output>%</label>
      <input type="range" class="range" id="wr" min="0" max="100" value="50">
      <div class="row" style="margin-top:auto"><button class="btn" id="lock">Таамаглал илгээх</button></div></section>`;
    const r=document.getElementById("wr"), dw=document.getElementById("dw");
    const set=v=>{ g=Math.round(Math.max(0,Math.min(100,v))); r.value=g; document.getElementById("wo").textContent=g; dw.innerHTML=dial(target,g,false); bindDrag(); };
    r.oninput=()=>set(+r.value);
    function bindDrag(){ const svg=document.getElementById("dial");
      const mv=e=>{ const b=svg.getBoundingClientRect(), x=(e.clientX-b.left)/b.width*320-160, y=160-(e.clientY-b.top)/b.height*180;
        set(100-Math.atan2(Math.max(y,0),x)/Math.PI*100); };
      svg.onpointerdown=e=>{ e.preventDefault(); mv(e); const m=ev=>mv(ev), u=()=>{window.removeEventListener("pointermove",m);window.removeEventListener("pointerup",u)}; window.addEventListener("pointermove",m); window.addEventListener("pointerup",u); }; }
    bindDrag();
    document.getElementById("lock").onclick=()=>reveal(target,g,spec);
  }
  function reveal(target,g,spec){
    const d=Math.abs(target-g), pts=d<=5?4:d<=10?3:d<=15?2:0; score+=pts;
    app.innerHTML=`<section class="view">${topBar("mood:"+from, MOODS[from].name)}
      ${spec}${dial(target,g,true)}
      <div class="pct" style="font-size:56px">${100-d}%</div>
      <p class="verdict" style="margin:0">${pts===4?"Тархины долгион нэг дээр! +4":pts?`Ойрхон байлаа, +${pts}`:"Өөр өөр долгион дээр байна 😅"}</p>
      <p class="note" style="margin:0">Нууц цэг ${target}%, таны таамаг ${g}%. Нийт оноо: ${score} (${round} тойрог)</p>${pts?"":penaltyHTML("Таамагласан хүмүүст")}
      <div class="row" style="margin-top:auto"><button class="btn" id="nx">Дараагийн тойрог</button></div></section>`;
    beep(pts?990:330,.2,.18);
    document.getElementById("nx").onclick=start;
  }
}

  hot:["Энд байгаа хүмүүсээс хэнтэй нь нууцаар болзож үзэх байсан бэ?","Хэн нь хамгийн сайхан үнсдэг байх гэж бодож байна?","Хэн нь хамгийн сексигээр харагддаг вэ?","Хэн нь өнөө орой хамгийн гоё харагдаж байна?","Хэн нь хамгийн олон хүнтэй үерхэж байсан гэж бодож байна?","Хэн нь хамгийн дэггүй бодолтой вэ?","Хэний гарыг атгамаар байна?","Хэн нь энд суугаа хэн нэгэнд нууцаар сэтгэлтэй гэж бодож байна?","Хэнтэй нь лифтэнд ганцаараа гацмаар байна?","Хэн нь хамгийн сайн сээтэгнэдэг вэ?","Үерхвэл хэн нь хамгийн их хардах вэ?","Хэн нь хуучин хайртдаа шөнө мессеж бичдэг гэж бодож байна?","Хэнтэй нь удаан бүжиг бүжиглэмээр байна?","Хэн нь анхны болзоон дээрээ үнсэлцдэг хүн бэ?","Хэний үнэр хамгийн сайхан вэ?","Хэн нь хамгийн романтик вэ?","Хэнтэй нь кино театрын хамгийн арын эгнээнд суумаар байна?","Хэн нь согтоод хуучин хайртдаа залгадаг төрлийн хүн бэ?","Хэний инстаграмыг нууцаар хамгийн их ухаж үздэг вэ?","Хэн нь хамгийн гоё биетэй вэ?","Хэн нь чамайг үнсье гэвэл татгалзахгүй байх вэ?","Хэн нь одоо нууц үерхэлтэй байж магадгүй вэ?","Хэнтэй нь нэг хөнжил дор кино үзмээр байна?","Хэнтэй нь хосын хувцас өмсөж зураг авахуулмаар байна?","Хэн нь хамгийн түрүүнд «Чамд таалагдаж байна» гэж зоригтой хэлдэг вэ?"]
};
let whLevel="fun";
function whisper(from){
  stopTimer(); setGlow(MOODS[from].c);
  const render=()=>{
    app.innerHTML=`<section class="view">${topBar("mood:"+from, MOODS[from].name)}
      <h2 style="font-size:22px">🤫 Шивнээ</h2>
      <ol class="rules"><li>Утас барьсан хүн нууц асуултыг ганцаараа уншина.</li><li>Хариулт болох хүний нэрийг <b>чангаар</b> хэлнэ. Асуултыг хэлэхгүй!</li><li>Нэрлэгдсэн хүн асуултыг мэдмээр бол зоос шиднэ, эсвэл шийтгэл хүлээгээд мэднэ. Дараагийн ээлжинд тэр хүн асуулт уншина.</li></ol>
      <div class="panel"><b>Түвшин</b><div class="wh-names" style="justify-content:flex-start">
        <button class="chip" data-lv="fun" aria-pressed="${whLevel==="fun"}">😄 Энгийн</button>
        <button class="chip" data-lv="hot" aria-pressed="${whLevel==="hot"}">😈 Дэггүй 18+</button></div></div>
      <div class="panel"><b>Тоглогчид</b>${namesEditor(3,12)}</div>
      <div class="row" style="margin-top:auto"><button class="btn" id="go">Эхлэх</button></div></section>`;
    const get=bindNames(3,12,render);
    app.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{ const v=b.dataset.lv;
      const set=()=>{ whLevel=v; app.querySelectorAll("[data-lv]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lv===v)); };
      if(v==="hot" && !adultOk) openGate(set); else set(); });
    document.getElementById("go").onclick=()=>{ const names=get(); if(names.length<3){ document.getElementById("go").textContent="Дор хаяж 3 нэр оруул"; return; } play(names); };
  };
  function play(names){
    let deckQ=shuffle(WHISPER_Q[whLevel]), reader=names[Math.floor(Math.random()*names.length)];
    const nextQ=()=>{ if(!deckQ.length) deckQ=shuffle(WHISPER_Q[whLevel]); return deckQ.pop(); };
    const head=`${topBar("mood:"+from, MOODS[from].name)}`;
    const pass=()=>{
      app.innerHTML=`<section class="view">${head}
        <div class="reveal"><span class="eyebrow">Утсыг дамжуул</span><h1>${esc(reader)}</h1><p class="note" style="margin:0">Бусад нь дэлгэц рүү битгий хар!</p>
        <button class="btn" id="see" style="flex:none;width:100%">Би ${esc(reader)}, нууцаар харах</button></div></section>`;
      document.getElementById("see").onclick=ask;
    };
    const ask=()=>{ const q=nextQ();
      app.innerHTML=`<section class="view">${head}
        <div class="panel" style="gap:18px"><span class="eyebrow" style="text-align:center">Зөвхөн ${esc(reader)} уншина</span><div class="wh-q">${esc(q)}</div></div>
        <p class="note" style="margin:0">Хариултаа чангаар хэлээд тэр хүний нэрийг дар.</p>
        <div class="wh-names">${names.filter(n=>n!==reader).map(n=>`<button class="chip" data-nm="${esc(n)}">${esc(n)}</button>`).join("")}</div></section>`;
      app.querySelectorAll("[data-nm]").forEach(b=>b.onclick=()=>named(q,b.dataset.nm));
    };
    const named=(q,who)=>{ beep(520,.1,.12);
      app.innerHTML=`<section class="view">${head}
        <div class="reveal"><span class="eyebrow">${esc(reader)} нэрлэлээ</span><h1>${esc(who)}!</h1><p style="margin:0;color:var(--ink-soft)">Асуулт юу байсныг мэдмээр байна уу?</p>
        <div id="res" style="width:100%"></div></div>
        <div class="row" id="acts" style="flex-direction:column;gap:10px">
          <button class="btn" id="coin">🪙 Зоос шидэх</button>
          <button class="btn ghost" id="pen">😈 Шийтгэл хүлээгээд мэдэх</button>
          <button class="btn skip" id="skip">🤐 Мэдэхгүй өнгөрөх</button></div></section>`;
      const res=document.getElementById("res"), acts=document.getElementById("acts");
      const reveal=extra=>`${extra||""}<div class="panel" style="margin-top:12px"><span class="eyebrow">Асуулт байсан нь</span><div class="wh-q">${esc(q)}</div></div>`;
      const done=html=>{ res.innerHTML=html; acts.innerHTML=`<button class="btn" id="nx">Дараагийн ээлж: ${esc(who)} уншина</button>`; document.getElementById("nx").onclick=()=>{ reader=who; pass(); }; };
      document.getElementById("coin").onclick=()=>{ acts.innerHTML=""; res.innerHTML=`<span class="coin spin">🪙</span>`; for(let k=0;k<6;k++) setTimeout(()=>beep(700+k*60,.03,.08),k*120);
        setTimeout(()=>{ const lucky=Math.random()<.5; beep(lucky?990:300,.2,.15);
          done(lucky?reveal(`<h2 style="font-size:20px">Сүлд буулаа! Асуулт илчлэгдлээ</h2>`):`<h2 style="font-size:20px">Тоо буулаа. Асуулт нууц хэвээр 🤐</h2>`); },950); };
      document.getElementById("pen").onclick=()=>done(penaltyHTML("Шийтгэл: "+who)+reveal());
      document.getElementById("skip").onclick=()=>{ reader=who; pass(); };
    };
    pass();
  }
  render();
}
/* ---------- Routing ---------- */
function startGame(id, from){
  if(DECKS[id]) deck(id,from); else if(id==="spy") spySetup(from); else if(id==="headsup") huPick(from,false); else if(id==="charades") huPick(from,true); else if(id==="bomb") bomb(from); else if(id==="missions") missions(from); else if(id==="match") match(from); else if(id==="picker") picker(from); else if(id==="shagai") shagai(from); else if(id==="wave") wave(from); else if(id==="nandin") nandin(from); else if(id==="spicy") spicy(from); else if(id==="wheel") wheel(from); else if(id==="whisper") whisper(from); else return false;
  return true;
}
function nav(hash){ if(location.hash===hash) route(); else location.hash=hash; }
function route(){
  document.querySelectorAll(".touchpad,.boom").forEach(el=>el.remove());
  gate.hidden=true; stopTimer();
  const r=location.hash.replace(/^#\/?/,"").split("/");
  if(r[0]==="mood" && MOODS[r[1]]) mood(r[1]);
  else if(r[0]==="game" && GAMES[r[1]] && MOODS[r[2]] && startGame(r[1],r[2])) {}
  else home();
  window.scrollTo({top:0,behavior:"instant"});
}
// every screen swap inside a game starts at the top too
new MutationObserver(()=>{ if(window.scrollY>0) window.scrollTo({top:0,behavior:"instant"}); }).observe(app,{childList:true});
app.addEventListener("click", e=>{
  const go=e.target.closest("[data-go]"), m=e.target.closest("[data-mood]"), g=e.target.closest("[data-game]");
  if(go){ const v=go.dataset.go; nav(v==="home" ? "#/" : "#/mood/"+v.slice(5)); }
  else if(m) nav("#/mood/"+m.dataset.mood);
  else if(g) nav("#/game/"+g.dataset.game+"/"+g.dataset.from);
});
window.addEventListener("hashchange", route);
route();
</script>
