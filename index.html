<style>
/* Brand "Design B": clean flat dark (no glows, no glass). Base #0A0A0C, flat cards #16161A with crisp 1.5px #26262C borders.
   Brand accents: coral #FF3B5C (logo "даа", 18+, main CTA) and electric yellow #FFD60A (room codes, highlights, winners).
   Each mood swaps --glow to its own accent: couples coral, friends yellow, family green, strangers sky. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --night:#0D0D10;
  --night-2:#18181D;
  --hover:#222229;
  --pill:#1C1C23;
  --edge:rgba(255,255,255,.04);
  --line:#2A2A31;
  --line-2:#3A3A44;
  --ink:#FFFFFF;
  --ink-soft:#A1A1AA;
  --coral:#FF3B5C; --yellow:#FFD60A;
  --glow:#FF3B5C;          /* accent, changes per mood */
  --glow-ink:#0A0A0C;
  --rose:#FF3B5C; --amber:#FFD60A; --teal:#22C55E; --lilac:#38BDF8;
  --card-ink:#0A0A0C; --card-soft:#6B6B76;
  --display:"Manrope","Montserrat","Arial Black",system-ui,sans-serif;
  --body:"Manrope","Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.view{min-height:0}
.tr{display:flex;align-items:center;gap:10px}
.snd{width:40px;height:40px;border-radius:999px;border:1px solid var(--edge);display:grid;place-items:center;font-size:18px;line-height:1}
.snd[aria-pressed="true"]{opacity:.6}
.custom{gap:10px}
.custom summary{cursor:pointer;font-weight:800;list-style:none}
.custom summary::-webkit-details-marker{display:none}
.custom textarea{width:100%;box-sizing:border-box;min-height:96px;padding:12px 14px;border-radius:12px;border:1px solid var(--edge);background:var(--night);color:var(--ink);font:inherit;resize:vertical}
.custom textarea:focus{outline:2px solid var(--glow);border-color:transparent}
.custom .cnt{font-size:13px;color:var(--ink-soft)}
.btn.story{background:var(--night-2);color:var(--ink);border:1.5px solid var(--yellow)}
.ai-card{display:flex;flex-direction:column;gap:14px;text-align:center;padding:26px 20px;border-radius:26px;background:var(--ink);color:#0A0A0C;min-height:min(300px,40dvh);justify-content:center}
.ai-card .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#6B6B76;line-height:1.5;padding-top:4px}
.ai-card .t{font-family:var(--display);font-size:clamp(26px,8vw,34px);line-height:1.3;color:#0A0A0C}
.ai-card .q{font-family:var(--display);font-weight:500;font-size:clamp(18px,5.2vw,22px);line-height:1.45;text-wrap:balance}
.ai-load{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.ai-load .sp{font-size:64px;line-height:1.3;animation:aipulse 1.2s ease-in-out infinite}
@keyframes aipulse{50%{transform:scale(1.2) rotate(12deg);opacity:.7}}
.login{padding:9px 14px;border-radius:999px;border:1px solid var(--glow);color:var(--ink);font-weight:800;font-size:14px;white-space:nowrap}
.av{width:36px;height:36px;border-radius:50%;border:2px solid var(--glow);overflow:hidden;display:grid;place-items:center;font-weight:800;background:var(--night-2);flex:none;padding:0}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.tr:has(.av) .brand{display:none}
@media (max-width:430px){ .top .tr .eyebrow{display:none} }
.umenu{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 64px);right:max(16px,calc(50% - 214px));width:min(280px,calc(100% - 32px));box-shadow:0 18px 50px rgba(0,0,0,.5)}
.foot-links{display:flex;justify-content:center;gap:14px;font-size:13px}
.foot-links a{color:var(--ink-soft)}
.legal{color:var(--ink-soft);font-size:15px}
.legal h3{color:var(--ink);font-size:16px;margin-top:8px}
.legal ul{padding-left:20px;margin:6px 0}
.room-code{font-family:var(--display);font-size:clamp(52px,17vw,76px);letter-spacing:.12em;text-align:center;color:var(--yellow);font-weight:800;line-height:1.2;padding-top:4px}
.qrbox{background:#fff;border-radius:16px;padding:10px;width:150px;height:150px;margin:0 auto;display:grid;place-items:center}
.qrbox img{width:100%;height:100%;image-rendering:pixelated}
.code-in{font-family:var(--display);font-size:32px;letter-spacing:.3em;text-align:center}
.tally{display:flex;flex-direction:column;gap:10px}
.tally .tr2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.tally .bar{grid-column:1/-1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.tally .bar i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .6s}
.wait{text-align:center;color:var(--ink-soft)}
.avi{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;vertical-align:middle;font-weight:800;color:#0A0A0C;object-fit:cover;line-height:1}
.chip .avi{margin-right:6px}
.pe-av{width:112px;height:112px;margin:0 auto;font-size:44px}
.guide-a{font-size:16px;line-height:1.55}
.ex-chips{display:flex;flex-wrap:wrap;gap:8px}
.ex-chips .chip{font-size:13px;text-align:left}
.ai-in{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid var(--edge);background:var(--night);color:var(--ink);font:inherit}
.ai-in:focus{outline:2px solid var(--glow);border-color:transparent}
.wh-names{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wh-names .chip{color:var(--ink);font-size:15px}
.wh-q{font-family:var(--display);font-weight:500;font-size:clamp(20px,5.8vw,25px);line-height:1.4;text-align:center;text-wrap:balance}
.coin{font-size:64px;line-height:1;display:inline-block}
.coin.spin{animation:coinspin .9s ease-out}
@keyframes coinspin{from{transform:rotateY(0)}to{transform:rotateY(1440deg)}}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden}
#app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;padding-block:20px 28px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.3;padding-top:4px;overflow:visible}
.view{display:flex;flex-direction:column;gap:18px;flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;color:#fff}
.brand b{color:var(--coral);font-weight:800}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 12px 8px 8px;border-radius:999px;border:1px solid var(--edge);color:var(--ink-soft);font-weight:600;font-size:14px}
.back:hover{color:var(--ink);border-color:var(--ink-soft)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;line-height:1.5;display:inline-block;overflow:visible;padding-top:4px;padding-bottom:2px}
.hero h1{font-size:clamp(28px,8vw,38px)}
.hero p{color:var(--ink-soft);margin:8px 0 0}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mood{position:relative;text-align:left;padding:16px 14px 14px;border-radius:18px;background:var(--bg,var(--night-2));border:0;
  display:flex;flex-direction:column;gap:6px;min-height:150px;overflow:hidden;transition:transform .12s,filter .12s}
.mood .ic{position:absolute;right:-10px;bottom:-14px;font-size:56px!important;transform:rotate(18deg);opacity:.9}
.mood h3{font-size:17px!important;margin-top:0!important;max-width:80%}
.mood small{max-width:68%}
.mood:hover{transform:translateY(-1px);filter:brightness(1.18)}
.mood:active{transform:scale(.98)}
.mood .ic{font-size:28px;line-height:1.5;padding-top:4px;overflow:visible}
.mood h3{font-size:15px;margin-top:auto}
.mood small{color:var(--ink-soft);font-size:13px;line-height:1.35}
.note{font-size:13px;color:var(--ink-soft);text-align:center;margin-top:auto}
.games{display:flex;flex-direction:column;gap:12px}
.game{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:18px;background:var(--night-2);border:1px solid var(--edge)}
.game:hover{border-color:var(--glow)}
.game{transition:transform .08s,border-color .08s}
.game:active{transform:scale(.98)}
.game .ic{width:48px;height:48px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:24px;line-height:1.5;padding-top:4px;box-sizing:border-box;overflow:visible;background:color-mix(in srgb,var(--glow) 14%,var(--night))}
.game div{min-width:0}
.game h3{font-size:15px}
.game p{margin:2px 0 0;color:var(--ink-soft);font-size:14px;line-height:1.35}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:var(--coral);color:#fff;margin-left:6px;vertical-align:2px}
.tabs{display:flex;gap:6px;padding:4px;border-radius:999px;background:var(--night-2);border:1px solid var(--edge)}
.tabs button{flex:1;padding:9px 6px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{background:var(--glow);color:var(--glow-ink)}
.stage{perspective:1200px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:min(340px,42dvh)}
.card{position:relative;-webkit-tap-highlight-color:transparent;width:100%;aspect-ratio:3/4;max-height:min(380px,55vh);margin:0 auto;max-width:100%;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;padding:26px 22px}
.front{background:var(--night-2);border:2px solid var(--glow);align-items:center;justify-content:center;gap:10px;text-align:center}
.front .big{font-family:var(--display);font-size:56px;color:var(--glow);line-height:1}
.front span{color:var(--ink-soft);font-weight:600}
.back-face{transform:rotateY(180deg);background:var(--ink);color:#0A0A0C;justify-content:space-between}
.back-face .kind{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6B6B76}
.back-face .q{font-family:var(--display);font-weight:500;font-size:clamp(20px,5.6vw,25px);line-height:1.35;text-wrap:balance}
.back-face .foot{display:flex;justify-content:space-between;font-size:13px;color:#6B6B76;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px}
.btn{flex:1;padding:15px 18px;border-radius:14px;font-weight:800;font-size:16px;text-align:center;background:var(--glow);color:var(--glow-ink);transition:transform .08s,filter .08s,border-color .08s;-webkit-tap-highlight-color:transparent}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn:disabled{transform:none;filter:none}
.btn.ghost{background:var(--night-2);color:var(--ink);border:1px solid var(--edge)}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.good{background:var(--teal);color:#062622}
.btn.skip{background:#26262C;color:var(--ink)}
.panel{background:var(--night-2);border:1px solid var(--edge);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper .ctl{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);font-size:22px;font-weight:800}
.stepper output{font-family:var(--display);font-size:22px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.rules{margin:0;padding-left:20px;color:var(--ink-soft);font-size:14px;display:flex;flex-direction:column;gap:4px}
.reveal{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;border-radius:26px;border:1px dashed var(--line);padding:28px 18px;min-height:min(320px,42dvh)}
.reveal .who{font-family:var(--display);font-size:30px}
.reveal .word{font-family:var(--display);font-size:clamp(30px,9vw,44px);color:var(--glow)}
.reveal p{color:var(--ink-soft);margin:0}
.timer{font-family:var(--display);font-size:64px;text-align:center;font-variant-numeric:tabular-nums;color:var(--glow);line-height:1}
.timer.low{color:var(--rose)}
.hu-word{flex:1;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:clamp(34px,11vw,54px);border-radius:26px;background:var(--ink);color:#0A0A0C;padding:24px;min-height:min(260px,36dvh);text-wrap:balance}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{padding:16px 12px;border-radius:16px;background:var(--night-2);border:1px solid var(--edge);font-weight:800;text-align:left;display:flex;flex-direction:column;gap:4px}
.cat:hover{border-color:var(--glow)}
.cat{transition:transform .08s,border-color .08s}
.cat:active{transform:scale(.98)}
.cat span{font-size:24px}
.cat small{color:var(--ink-soft);font-weight:600}
.results{display:flex;flex-wrap:wrap;gap:6px}
.results span{padding:4px 10px;border-radius:999px;font-size:14px;font-weight:700;background:color-mix(in srgb,var(--teal) 20%,transparent)}
.results span.x{background:#1E1E24;color:var(--ink-soft);text-decoration:line-through}
.gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,10,12,.94);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.gate .panel{max-width:380px;text-align:center}
.gate h2{font-size:22px}
.gate p{margin:0;color:var(--ink-soft)}
.spylist{display:flex;flex-direction:column;gap:6px;font-weight:700}
.spylist div{display:flex;justify-content:space-between;padding:8px 12px;border-radius:12px;background:var(--night)}
.spylist .spy{color:var(--rose)}
.bomb{width:min(220px,60vw);aspect-ratio:1;max-width:100%;margin:8px auto;border-radius:50%;display:grid;place-items:center;font-size:84px;
  background:radial-gradient(circle at 35% 30%,#3A3A44,#16161A 70%);box-shadow:0 0 0 6px var(--glow);animation:pulse var(--beat,.9s) ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.prompt{text-align:center;font-family:var(--display);font-size:clamp(22px,6.5vw,30px);text-wrap:balance}
.boom{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--rose);color:#2b0610;text-align:center;font-family:var(--display);animation:flash .5s ease-out}
.boom div{font-size:clamp(44px,14vw,72px)}
.boom p{font-family:var(--body);font-weight:800;font-size:18px;margin:8px 0 0}
@keyframes flash{from{background:#fff}}
.names{display:flex;flex-direction:column;gap:8px}
.names .nm{display:flex;gap:8px}
.names input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--edge);background:var(--night);color:var(--ink);font:inherit}
.names input:focus{outline:2px solid var(--glow);border-color:transparent}
.names .rm{width:44px;border-radius:12px;border:1px solid var(--edge);color:var(--ink-soft);font-size:20px}
.mission{font-family:var(--display);font-weight:500;font-size:clamp(19px,5.4vw,23px);line-height:1.4;text-wrap:balance}
.target{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--glow);color:var(--glow-ink);font-weight:800}
.mlist{display:flex;flex-direction:column;gap:10px}
.mitem{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:16px;background:var(--night-2);border:1px solid var(--edge)}
.mitem[aria-pressed="true"]{border-color:var(--teal)}
.mitem .ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800}
.mitem[aria-pressed="true"] .ck{background:var(--teal);border-color:var(--teal);color:#062622}
.mitem div{min-width:0}.mitem b{display:block}.mitem small{color:var(--ink-soft);font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:18px 12px;border-radius:16px;background:var(--night-2);border:1px solid var(--edge);font-weight:800;font-size:16px}
.opt:hover{border-color:var(--glow)}
.opt{transition:transform .08s,border-color .08s}
.opt:active{transform:scale(.98)}
.opt.right{background:var(--teal);color:#062622;border-color:var(--teal)}
.opt.wrong{background:#3A1520;border-color:var(--rose)}
.pct{font-family:var(--display);font-size:72px;color:var(--glow);text-align:center;line-height:1}
.qline{font-family:var(--display);font-size:clamp(20px,5.8vw,26px);text-align:center;text-wrap:balance}
.who-line{text-align:center;color:var(--ink-soft);font-weight:700}
.touchpad{position:fixed;inset:0;z-index:15;background:var(--night);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.touchpad .hint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 70px);text-align:center;padding-inline:24px;color:var(--ink-soft);font-weight:700;pointer-events:none}

/* No-repeat memory: shown cards are remembered per deck in localStorage ("seen:<key>" = text hashes). Unseen cards always come first;
   once every card of a deck has been seen the memory for that deck resets and it starts over freshly shuffled. */
const hk = v => { const t=typeof v==="string"?v:JSON.stringify(v); let h=5381; for(let i=0;i<t.length;i++) h=((h*33)^t.charCodeAt(i))>>>0; return h.toString(36); };
function seenGet(k){ try{ return new Set(JSON.parse(localStorage.getItem("seen:"+k)||"[]")); }catch(e){ return new Set(); } }
function seenSave(k,set){ try{ localStorage.setItem("seen:"+k, JSON.stringify([...set].slice(-800))); }catch(e){} }
function markSeen(k,v){ if(v==null) return; const st=seenGet(k); st.add(hk(v)); seenSave(k,st); }
function freshOrder(k,arr){ const st=seenGet(k), un=arr.filter(v=>!st.has(hk(v))); if(!un.length){ seenSave(k,new Set()); return shuffle(arr); } return shuffle(un).concat(shuffle(arr.filter(v=>st.has(hk(v))))); }
function pickFresh(k,arr){ const v=freshOrder(k,arr)[0]; markSeen(k,v); return v; }
function clearSeen(){ try{ Object.keys(localStorage).filter(k=>k.startsWith("seen:")).forEach(k=>localStorage.removeItem(k)); }catch(e){} }

/* ---------- How well do you know ---------- */
function match(from){
  stopTimer(); setGlow(MOODS[from].c);
  let N=10; try{ N=+localStorage.getItem("matchN")||10; }catch(e){}
  setup();
  function setup(){
    app.innerHTML=`<section class="view">${topBar("mood:"+from, MOODS[from].name)}
      <h2 style="font-size:22px">🎯 Хэр сайн мэддэг вэ?</h2>
      <ol class="rules"><li>Нэгдүгээр хүн бүх асуултад өөрийнхөө тухай нууцаар дараалан хариулна.</li><li>Дараа нь утсаа хоёрдугаар хүнд өгнө. Тэр нөгөөгийнхөө хариултыг бүгдийг нь таана.</li><li>Төгсгөлд хэдэн хувь таарсан, аль асуулт дээр зөрснөө харна.</li></ol>
      ${namesPanel()}
      <div class="panel"><b>Хэдэн асуулт?</b><div class="wh-names" style="justify-content:flex-start">${[5,10].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${n===N}">${n} асуулт</button>`).join("")}</div></div>
      <div class="row" style="margin-top:auto"><button class="btn" id="go">Эхлэх</button></div></section>`;
    app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ N=+b.dataset.n; try{ localStorage.setItem("matchN",N); }catch(e){} app.querySelectorAll("[data-n]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.n===N)); });
    document.getElementById("go").onclick=()=>{ const [a,b]=namesRead(["Нэгдүгээр хүн","Хоёрдугаар хүн"]); run(a,b); };
  }
  function run(a,b){
    const qs=freshOrder("match",MATCH_Q).slice(0,N); qs.forEach(q=>markSeen("match",q));
    const ans=[], gs=[]; let i=0;
    answer();
    function answer(){
      if(i>=N){ i=0; return handoff(); }
      const [q,opts]=qs[i];
      app.innerHTML=`<section class="view">${topBar("mood:"+from,"Зогсоох")}
        <div class="mprog"><i style="width:${i/N*100}%"></i></div>
        <p class="who-line">${i+1} / ${N} · Зөвхөн <b style="color:var(--glow)">${esc(a)}</b> хар</p>
        <div class="qline">${esc(q)}</div><p class="note" style="margin:0">Өөрийнхөө тухай үнэнээр хариул</p>
        <div class="opts">${opts.map((o,n)=>`<button class="opt" data-o="${n}">${esc(o)}</button>`).join("")}</div>
        ${i>0?`<button class="linkbtn" id="back" style="align-self:center">‹ Өмнөх асуулт руу буцах</button>`:""}</section>`;
      app.querySelectorAll("[data-o]").forEach(x=>x.onclick=()=>{ ans[i]=+x.dataset.o; i++; answer(); });
      const bk=document.getElementById("back"); if(bk) bk.onclick=()=>{ i--; answer(); };
    }
    function handoff(){
      app.innerHTML=`<section class="view">${topBar("mood:"+from,"Зогсоох")}
        <div class="reveal"><p>${esc(a)} бүх ${N} асуултад хариуллаа ✓</p><div class="who">Утсаа ${esc(b)}-д өгнө үү</div>
        <p>${esc(b)}, одоо ${esc(a)} юу гэж хариулсныг ээлж дараалан таана.</p>
        <button class="btn" id="ready" style="flex:none;width:100%">Би бэлэн</button></div></section>`;
      document.getElementById("ready").onclick=guess;
    }
    function guess(){
      if(i>=N) return result();
      const [q,opts]=qs[i];
      app.innerHTML=`<section class="view">${topBar("mood:"+from,"Зогсоох")}
        <div class="mprog"><i style="width:${i/N*100}%"></i></div>
        <p class="who-line">${i+1} / ${N} · ${esc(b)}, <b style="color:var(--glow)">${esc(a)}</b> юу гэж хариулсан бэ?</p>
        <div class="qline">${esc(q)}</div>
        <div class="opts">${opts.map((o,n)=>`<button class="opt" data-g="${n}">${esc(o)}</button>`).join("")}</div>
        <p class="note" id="fb" style="min-height:1.6em;margin:0"></p></section>`;
      let locked=false;
      app.querySelectorAll("[data-g]").forEach(x=>x.onclick=()=>{
        if(locked) return; locked=true; const g=+x.dataset.g, ok=g===ans[i]; gs[i]=g;
        app.querySelector(`[data-g="${ans[i]}"]`).classList.add("right"); if(!ok) x.classList.add("wrong");
        document.getElementById("fb").textContent = ok?"Таарлаа! 🎉":"Зөрлөө 😅"; ok?beep(880,.1,.12):beep(330,.15,.1);
        setTimeout(()=>{ i++; guess(); }, 1000);
      });
    }
    function result(){
      const hits=qs.filter((_,k)=>gs[k]===ans[k]).length, pct=Math.round(hits/N*100);
      const label = pct>=80?"Сэтгэл нэгт хос":pct>=60?"Бие биеэ сайн мэддэг":pct>=40?"Нээх зүйл их байна":"Танилцах шинэ аялал эхэллээ";
      app.innerHTML=`<section class="view">${topBar("mood:"+from, MOODS[from].name)}
        <div class="hero" style="text-align:center"><span class="eyebrow">${esc(a)} & ${esc(b)}</span></div>
        <div class="pct">${pct}%</div><h2 style="text-align:center;font-size:22px">${label}</h2>
        <p class="note" style="margin:0">${hits} / ${N} асуулт таарлаа.</p>
        <div class="mlist">${qs.map(([q,opts],k)=>{ const ok=gs[k]===ans[k]; return `<div class="mrow ${ok?"ok":"no"}"><span class="mi">${ok?"✓":"✗"}</span><div><b>${esc(q)}</b><small>${esc(a)}: ${esc(opts[ans[k]])}${ok?"":` · ${esc(b)} таасан: ${esc(opts[gs[k]])}`}</small></div></div>`; }).join("")}</div>
        ${hits<N?penaltyHTML(`${b}-д зөрсний шийтгэл`):""}
        <div class="row" style="flex-direction:column"><button class="btn story" id="st">📸 Story зураг хадгалах</button><button class="btn" id="sw">🔁 Солиод тоглох: ${esc(b)} хариулна</button><button class="btn ghost" id="re">Шинээр эхлэх</button></div></section>`;
      beep(pct>=60?990:660,.25,.15); buzz([60,40,120]); track("match_done",{n:N,pct});
      document.getElementById("st").onclick=()=>shareStory({game:"Хэр сайн мэддэг вэ?", ic:"🎯", big:pct+"%", line:`Бид ${pct}% таарлаа`, sub:`${a} & ${b} · ${label}`});
      document.getElementById("sw").onclick=()=>run(b,a);
      document.getElementById("re").onclick=setup;
    }
  }
}

let pickMode="one";
function picker(from){
  stopTimer(); setGlow(MOODS[from].c);

  document.body.appendChild(pad);

  modes.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{ pickMode=b.dataset.pm; modes.querySelectorAll("[data-pm]").forEach(x=>x.setAttribute("aria-pressed",x===b)); reset(); });
  function reset(){ clearTimeout(wait); done=false; cardBox.innerHTML=""; pad.querySelectorAll(".dot").forEach(d=>d.remove()); pts.clear(); modes.hidden=false; idle(); }
  const need=()=>pickMode==="team"?4:2;
  function arm(){ clearTimeout(wait); if(done) return;
    if(pts.size>=need()){ hint.innerHTML=`<b>${pts.size} хуруу</b>Хөдөлгөлгүй барь...`; wait=setTimeout(pick,2500); }
    else hint.innerHTML=`<b>Хуруугаа тавь</b>Дор хаяж ${need()} хүн хэрэгтэй.`; }
  function pick(){ done=true; modes.hidden=true; beep(660,.12,.2); setTimeout(()=>beep(990,.25,.2),130); buzz([60,40,200]);
    try{ navigator.vibrate && navigator.vibrate(200); }catch(e){}
    const ids=[...pts.keys()];
    if(pickMode==="team"){
      shuffle(ids).forEach((id,n)=>{ const d=pts.get(id), A=n%2===0; d.style.setProperty("--c",A?"var(--teal)":"var(--rose)"); d.classList.add("team"); d.innerHTML=`<span class="lbl">${A?"А":"Б"}</span>`; d.style.animation="none"; d.style.background=A?"var(--teal)":"var(--rose)"; });
      hint.innerHTML=`<b>Багууд бэлэн!</b>Ногоон нь А баг, ягаан нь Б баг. Дахин хуваахын тулд бүгд хуруугаа ав.`; return; }
    const w=ids[Math.floor(Math.random()*ids.length)];
    pts.forEach((el,id)=>el.classList.add(id===w?"win":"lose"));
    if(pickMode==="one"){ const pk = stakes.size && Math.random()<.6 ? penalty().text : pickFresh("pick"+(from==="couples"?":2":""), forFrom(PICK_TASKS)); hint.innerHTML=`<b>${esc(pk)}</b>Дахин сонгохын тулд бүгд хуруугаа аваад шинээр тавь.`; return; }
    hint.innerHTML=`<b>Чи сонгогдлоо!</b>`;
    cardBox.innerHTML=`<div class="tdcard panel"><h2 style="text-align:center">Үнэн үү, Зориг уу?</h2><div class="row"><button class="btn ghost" id="tdT">Үнэн</button><button class="btn" id="tdD">Зориг</button></div></div>`;
    const show=(kind,list)=>{ cardBox.innerHTML=`<div class="tdcard panel"><span class="eyebrow">${kind}</span><div class="mission">${esc(pickFresh("td:"+kind+(from==="couples"?":2":""), forFrom(list)))}</div><button class="btn" id="tdNext" style="flex:none">Дараагийн тойрог</button></div>`;
      cardBox.querySelector("#tdNext").onclick=reset; };
    cardBox.querySelector("#tdT").onclick=()=>show("Үнэн",TRUTHS);
    cardBox.querySelector("#tdD").onclick=()=>show("Зориг",DARES);
  }
  pad.addEventListener("pointerdown",e=>{ if(e.target.closest("button")) return; audio(); e.preventDefault();
    if(done && pts.size===0 && pickMode!=="td"){ reset(); }
    if(done||pts.size>=8) return;
    const d=document.createElement("div"); d.className="dot"; d.style.setProperty("--c",colors[ci++%colors.length]);
    d.style.left=e.clientX+"px"; d.style.top=e.clientY+"px"; pad.appendChild(d); pts.set(e.pointerId,d); arm(); });
  pad.addEventListener("pointermove",e=>{ const d=pts.get(e.pointerId); if(d&&!done){ d.style.left=e.clientX+"px"; d.style.top=e.clientY+"px"; } });
  const up=e=>{ const d=pts.get(e.pointerId); if(!d) return; pts.delete(e.pointerId); if(done) return; d.remove(); arm(); };
  pad.addEventListener("pointerup",up); pad.addEventListener("pointercancel",up);
}

function wish(from){
  stopTimer(); setGlow(MOODS[from].c);
  let lv="rom"; const N=12;
  setup();
  function setup(){
    app.innerHTML=`<section class="view">${topBar("mood:"+from, MOODS[from].name)}
      <h2 style="font-size:22px">❤️ Нууц хүсэл</h2>
      <ol class="rules"><li>Нэгдүгээр хүн ${N} санааг нууцаар ❤️ Тийм, 🤔 Магадгүй, ✕ Үгүй гэж тэмдэглэнэ.</li><li>Утсаа өгөхөд хоёрдугаар хүн мөн адил тэмдэглэнэ. Нөгөөгийнхөө хариултыг харахгүй.</li><li>Төгсгөлд зөвхөн хоёулаа хүссэн зүйлс л гарна. Нэг нь л хүссэн зүйл хэзээ ч илчлэгдэхгүй.</li></ol>
      ${namesPanel()}
      <div class="panel"><b>Төрөл</b><div class="wh-names" style="justify-content:flex-start"><button class="chip" data-wl="rom" aria-pressed="${lv==="rom"}">💕 Романтик</button><button class="chip" data-wl="hot" aria-pressed="${lv==="hot"}">🔥 Халуухан 18+</button></div></div>
      <div class="row" style="margin-top:auto"><button class="btn" id="go">Эхлэх</button></div></section>`;
    app.querySelectorAll("[data-wl]").forEach(b=>b.onclick=()=>{ const v=b.dataset.wl; const set=()=>{ lv=v; app.querySelectorAll("[data-wl]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.wl===lv)); };
      if(v==="hot"&&!adultOk) openGate(set); else set(); });
    document.getElementById("go").onclick=()=>{ const [a,b]=namesRead(["Нэгдүгээр хүн","Хоёрдугаар хүн"]); run(a,b); };
  }
  function run(a,b){
    const key="wish:"+lv, items=freshOrder(key, lv==="hot"?WISH_HOT:WISH_ROMANTIC).slice(0,N); items.forEach(x=>markSeen(key,x));
    const R=[[],[]];
    play(0,0);
    function play(p,i){
      if(i>=N) return p===0?handoff():result();
      const who=p?b:a;
      app.innerHTML=`<section class="view">${topBar("mood:"+from,"Зогсоох")}
        <div class="mprog"><i style="width:${i/N*100}%"></i></div>
        <p class="who-line">${i+1} / ${N} · Зөвхөн <b style="color:var(--glow)">${esc(who)}</b> хар</p>
        <div class="wishcard">${esc(items[i])}</div>
        <div class="wbtns"><button class="btn ghost" data-v="0">✕ Үгүй</button><button class="btn ghost" data-v="1">🤔 Магадгүй</button><button class="btn" data-v="2">❤️ Тийм</button></div>
        ${i>0?`<button class="linkbtn" id="back" style="align-self:center">‹ Өмнөх рүү буцах</button>`:""}</section>`;
      app.querySelectorAll("[data-v]").forEach(x=>x.onclick=()=>{ R[p][i]=+x.dataset.v; play(p,i+1); });
      const bk=document.getElementById("back"); if(bk) bk.onclick=()=>play(p,i-1);
    }
    function handoff(){
      app.innerHTML=`<section class="view">${topBar("mood:"+from,"Зогсоох")}
        <div class="reveal"><p>${esc(a)}-ийн хариулт нууц хэвээр ✓</p><div class="who">Утсаа ${esc(b)}-д өгнө үү</div>
        <p>Зөвхөн хоёулаа хүссэн зүйл л илчлэгдэнэ.</p><button class="btn" id="ready" style="flex:none;width:100%">Би бэлэн</button></div></section>`;
      document.getElementById("ready").onclick=()=>play(1,0);
    }
    function result(){
      const both=items.map((t,k)=>[t,R[0][k],R[1][k]]).filter(x=>x[1]>=1&&x[2]>=1), yes=both.filter(x=>x[1]===2&&x[2]===2), maybe=both.filter(x=>!(x[1]===2&&x[2]===2));
      app.innerHTML=`<section class="view">${topBar("mood:"+from, MOODS[from].name)}
        <div class="hero" style="text-align:center"><span class="eyebrow">${esc(a)} & ${esc(b)}</span></div>
        <div class="pct">${both.length}</div><h2 style="text-align:center;font-size:22px">${both.length?"нууц хүсэл таарлаа 💘":"Энэ удаа таарсан хүсэл алга 🙈"}</h2>
        ${yes.length?`<div class="panel"><b>❤️ Хоёулаа хүсэж байна</b><div class="mlist">${yes.map(x=>`<div class="mrow ok"><span class="mi">❤️</span><div><b>${esc(x[0])}</b></div></div>`).join("")}</div></div>`:""}
        ${maybe.length?`<div class="panel"><b>🤔 Ярилцаад үзэх</b><div class="mlist">${maybe.map(x=>`<div class="mrow"><span class="mi">🤔</span><div><b>${esc(x[0])}</b></div></div>`).join("")}</div></div>`:""}
        <p class="note" style="margin:0">Нэг нь л хүссэн зүйлс нууц хэвээр үлдлээ.</p>
        <div class="row" style="flex-direction:column"><button class="btn story" id="st">📸 Story зураг хадгалах</button><button class="btn" id="again">Дахиад ${N} хүсэл</button><button class="btn ghost" id="re">Шинээр эхлэх</button></div></section>`;
      beep(both.length?990:520,.25,.15); track("wish_done",{level:lv, n:both.length});
      document.getElementById("st").onclick=()=>shareStory({game:"Нууц хүсэл", ic:"❤️", big:String(both.length), line:"нууц хүсэл маань таарлаа", sub:`${a} & ${b}`});
      document.getElementById("again").onclick=()=>run(a,b);
      document.getElementById("re").onclick=setup;
    }
  }
}

/* ---------- Shared AI call + helper quotas ---------- */
const AIQ = {whisper:[]};
function quotaLeft(bucket, limit){ try{ const q=JSON.parse(localStorage.getItem("aiQ_"+bucket)||"{}"); return Math.max(0, limit-(q.date===today()?q.used:0)); }catch(e){ return limit; } }
function quotaUse(bucket){ try{ const k="aiQ_"+bucket, q=JSON.parse(localStorage.getItem(k)||"{}"); const used=(q.date===today()?q.used:0)+1; localStorage.setItem(k,JSON.stringify({date:today(),used})); }catch(e){} }
const HELP_LIMIT = () => user ? 20 : 10;
async function aiCall(body){
  if(!navigator.onLine) throw {code:"offline"};
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),35000);
  try{
    const r=await fetch(SUPA_URL+"/functions/v1/generate-deck",{method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/json","apikey":SUPA_KEY},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ try{ console.warn("generate-deck", r.status, j); }catch(_){} throw {code:j.error||("http_"+r.status)}; }
    return j;
  }catch(e){ throw (e&&e.code)?e:{code:(e&&e.name==="AbortError")?"ai_timeout":"network"}; }
  finally{ clearTimeout(to); }
}
const aiErrText = code => (AI_ERR[code] || "AI-тай холбогдож чадсангүй. Дахин оролдоорой.") + errCode(code);
// A small "✨" panel inside a game's start screen. getBody() returns the request (or a string error); onItems(items, input) applies the result.
function aiHelperBox(key, {title, placeholder, btn}){
  return `<details class="panel custom" id="ah-${key}"><summary>✨ ${esc(title)}</summary>
    <input class="ai-in" id="ahIn-${key}" maxlength="80" placeholder="${esc(placeholder)}">
    <div class="row" style="align-items:center"><span class="cnt" id="ahMsg-${key}" style="flex:1">Өнөөдөр ${quotaLeft("helper",HELP_LIMIT())} AI оролдлого үлдсэн</span><button class="btn" id="ahGo-${key}" style="flex:none">${esc(btn)}</button></div></details>`;
}
function bindAiHelper(key, getBody, onItems){
  const go=document.getElementById("ahGo-"+key), inp=document.getElementById("ahIn-"+key), msg=document.getElementById("ahMsg-"+key);
  if(!go) return;
  go.onclick=async()=>{
    const text=inp.value.trim(); if(!text){ msg.textContent="Эхлээд нэг мөр бич"; inp.focus(); return; }
    if(!quotaLeft("helper",HELP_LIMIT())){ msg.textContent="Өнөөдрийн AI оролдлого дууслаа"; return; }
    const body=getBody(text); if(typeof body==="string"){ msg.textContent=body; return; }
    go.disabled=true; go.textContent="✨ …"; msg.textContent="AI бодож байна…";
    try{ const j=await aiCall(body); if(!Array.isArray(j.items)||!j.items.length) throw {code:"ai_empty"};
      quotaUse("helper"); track("ai_helper",{mode:body.mode, n:j.items.length}); beep(990,.15,.12); buzz(30);
      const m=document.getElementById("ahMsg-"+key); if(m) m.textContent=onItems(j.items, text)||"✓ Бэлэн"; }
    catch(e){ const m=document.getElementById("ahMsg-"+key); if(m) m.textContent=aiErrText(e.code); track("ai_helper_error",{mode:body.mode, code:e.code}); }
    finally{ const g=document.getElementById("ahGo-"+key); if(g){ g.disabled=false; g.textContent="Үүсгэх"; } }
  };
}

const SITE_URL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? location.origin + location.pathname : "https://hamtdaa.app/";
let sb=null, user=null, aiRerender=null;
function sbClient(){
  if(!sb && window.supabase && window.supabase.createClient){
    try{ sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {auth:{flowType:"pkce", detectSessionInUrl:true, persistSession:true, autoRefreshToken:true}}); }catch(e){ sb=null; }
  }
  return sb;
}
function profileCache(){ try{ const p=JSON.parse(localStorage.getItem("profile")||"null"); return p&&user&&p.uid===user.id?p:null; }catch(e){ return null; } }
const userName = () => user ? (user.user_metadata?.custom_name || profileCache()?.name || user.user_metadata?.full_name || user.user_metadata?.name || (user.email||"").split("@")[0] || "Та") : "";
const profilePic = () => user ? (user.user_metadata?.custom_avatar || profileCache()?.avatar || user.user_metadata?.avatar_url || user.user_metadata?.picture || "") : "";
function authBtn(){
  if(!user) return `<button class="login" data-auth>Нэвтрэх</button>`;
  const pic=profilePic();
  return `<button class="av" data-auth aria-label="${esc(userName())}">${pic?`<img src="${esc(pic)}" alt="" referrerpolicy="no-referrer">`:esc(userName().slice(0,1).toUpperCase())}</button>`;
}
function refreshAuthUI(){
  closeUserMenu();
  const r=location.hash.replace(/^#\/?/,"").split("/");
  if(!r[0]) { home(); return; }
  document.querySelectorAll(".top .tr").forEach(tr=>{ tr.querySelectorAll("[data-auth]").forEach(b=>b.remove()); if(user){ const s=document.createElement("span"); s.innerHTML=authBtn(); tr.insertBefore(s.firstChild, tr.querySelector(".brand")); } });
  if(aiRerender) aiRerender();
  const rn=document.getElementById("rmName"); if(rn && !rn.value && user) rn.value=userName().slice(0,16);
}
async function initAuth(){
  if(!window.supabase){ await new Promise(res=>{ let n=0; const t=setInterval(()=>{ if(window.supabase||++n>40){ clearInterval(t); res(); } },100); }); }
  const c=sbClient(); if(!c) return;
  c.auth.onAuthStateChange((ev, session)=>{
    const nu=session?.user||null, changed=(nu?.id||null)!==(user?.id||null); user=nu;
    if(changed){ refreshAuthUI(); if(ev==="SIGNED_IN") track("login",{method:"google"}); }
  });
  try{ const {data}=await c.auth.getSession(); const nu=data?.session?.user||null; if((nu?.id||null)!==(user?.id||null)){ user=nu; refreshAuthUI(); } }catch(e){}
}
async function signIn(btn){
  const c=sbClient();
  if(!c || !navigator.onLine){ if(btn) btn.textContent="Интернэт хэрэгтэй"; return; }
  track("login_start",{method:"google"});
  const {error}=await c.auth.signInWithOAuth({provider:"google", options:{redirectTo:SITE_URL}});
  if(error && btn) btn.textContent="Алдаа гарлаа";
}
function closeUserMenu(){ document.querySelectorAll(".umenu").forEach(m=>m.remove()); }
function userMenu(){
  if(document.querySelector(".umenu")){ closeUserMenu(); return; }
  const m=document.createElement("div"); m.className="panel umenu";
  m.innerHTML=`<b>${esc(userName())}</b><span class="note" style="margin:0;text-align:left">AI багц: өдөрт ${AI_DAILY_USER} удаа</span>
    <button class="btn ghost" id="umEdit">🖼️ Зураг ба нэр засах</button><button class="btn ghost" id="umOut">Гарах</button><a href="#/privacy" class="note" style="margin:0" id="umPriv">Нууцлалын бодлого</a>`;
  document.body.appendChild(m);
  m.querySelector("#umOut").onclick=async()=>{ closeUserMenu(); try{ await sbClient()?.auth.signOut(); }catch(e){} user=null; refreshAuthUI(); };
  m.querySelector("#umPriv").onclick=closeUserMenu;
  m.querySelector("#umEdit").onclick=()=>{ closeUserMenu(); profileEditor(); };
}
document.addEventListener("click", e=>{
  const a=e.target.closest("[data-auth]");
  if(a){ e.stopPropagation(); user ? userMenu() : signIn(a); return; }
  if(!e.target.closest(".umenu")) closeUserMenu();
}, true);


/* ---------- Profile editor: photo -> 160x160 JPEG data URL in user_metadata ---------- */
async function compressAvatar(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const s=Math.min(im.naturalWidth,im.naturalHeight), sx=(im.naturalWidth-s)/2, sy=(im.naturalHeight-s)/2;
    let out="";
    for(const size of [160,128,96]){
      const cv=document.createElement("canvas"); cv.width=cv.height=size; const x=cv.getContext("2d");
      x.fillStyle="#fff"; x.fillRect(0,0,size,size); x.drawImage(im,sx,sy,s,s,0,0,size,size);
      for(const q of [.82,.72,.62,.5,.4]){ out=cv.toDataURL("image/jpeg",q); if(out.length<=9000) return out; }
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

async function waitSb(){ if(!window.supabase){ await new Promise(res=>{ let n=0; const t=setInterval(()=>{ if(window.supabase||++n>30){ clearInterval(t); res(); } },100); }); } return sbClient(); }
// peek at both room types for this code (no track), resolve "vote" | "draw" | null
async function detectRoomKind(code){
  const c=await waitSb(); if(!c||!navigator.onLine) return null;
  return new Promise(res=>{ let done=false; const chs=[];
    const fin=async k=>{ if(done) return; done=true; clearTimeout(t); await Promise.all(chs.map(ch=>Promise.resolve().then(()=>c.removeChannel(ch)).catch(()=>{}))); res(k); };
    [["room-","vote"],["draw-","draw"],["photo-","photo"]].forEach(([pre,k])=>{ const ch=c.channel(pre+code,{config:{presence:{key:"peek-"+myId}}}); chs.push(ch);
      ch.on("presence",{event:"sync"},()=>{ const st=ch.presenceState?.()||{}; if(Object.values(st).some(a=>a&&a[0]&&a[0].host)) fin(k); }); ch.subscribe(); });
    const t=setTimeout(()=>fin(null),4000); });
}

async function connectRoom(code, isHost, name, from){
  leaveRoom();
  app.innerHTML=`<section class="view">${topBar("mood:"+from, MOODS[from].name)}<div class="ai-load"><div class="sp">🔌</div><h2 style="font-size:22px">Өрөөнд холбогдож байна…</h2></div></section>`;
  if(!window.supabase){ await new Promise(res=>{ let n=0; const t=setInterval(()=>{ if(window.supabase||++n>30){ clearInterval(t); res(); } },100); }); }
  const c=sbClient(); if(!c || !navigator.onLine){ roomError("Интернэт холболтоо шалгана уу"); return; }
  const ch=c.channel("room-"+code, {config:{broadcast:{self:true, ack:false}, presence:{key:myId}}});
  const R = room = {code, ch, from, host:isHost, me:{id:myId,name}, level:isHost?roomLevel:"fun", view:"lobby",
    round:null, votes:{}, totals:{}, rounds:0, deck:[], hostSeen:false, myVote:null, at:Date.now()};
  ch.on("broadcast",{event:"msg"},({payload})=>{ if(room===R) onRoomMsg(payload||{}); });
  ch.on("presence",{event:"sync"},()=>{ if(room===R) onRoomPresence(); });
  ch.subscribe(async status=>{
    if(room!==R) return;
    if(status==="SUBSCRIBED"){
      await ch.track({id:myId, name, host:isHost, at:R.at, pic:(user?profilePic():"")||""});
      if(isHost){ track("room_created",{level:R.level}); setTimeout(()=>{ if(room!==R) return; const other=roomPlayers(true).find(p=>p.host && p.id!==myId); if(other){ connectRoom(String(1000+Math.floor(Math.random()*9000)),true,name,from); return; } roomSend({t:"lobby", level:R.level}); },1200); renderRoom(); }
      else { track("room_joined",{}); R.findT=setTimeout(()=>{ if(room===R && !R.hostSeen) roomError(`${code} кодтой өрөө олдсонгүй`); },5000); renderRoom(); }
    } else if(status==="CHANNEL_ERROR" || status==="TIMED_OUT"){ roomError("Өрөөнд холбогдож чадсангүй"); }
  });
}
function roomPlayers(raw){
  if(!room) return [];
  const st=room.ch.presenceState?.()||{}, list=[];
  Object.values(st).forEach(arr=>{ const p=arr&&arr[0]; if(p&&p.id&&!list.some(x=>x.id===p.id)) list.push({id:p.id,name:p.name,host:!!p.host,at:p.at||0,pic:p.pic||""}); });
  list.sort((a,b)=>(b.host-a.host)||(a.at-b.at));
  return raw?list:list.slice(0,12);
}

const DR_COLORS=[["#0A0A0C","Хар"],["#e5484d","Улаан"],["#3b82f6","Цэнхэр"],["#22a55b","Ногоон"],["#f5c518","Шар"],["#ffffff","Баллуур"]];
const DR_WIDTHS=[.008,.018,.04];
function makePad(box, {editable=false, onBegin, onPoint, onUndo, onClear}={}){
  box.innerHTML=`<canvas class="dpad" style="touch-action:none"></canvas>`;
  const cv=box.querySelector("canvas"), x=cv.getContext("2d");
  const pad={strokes:[], color:DR_COLORS[0][0], width:DR_WIDTHS[1], cv};
  let W=0;
  const size=()=>{ const w=Math.round(box.clientWidth||300), dpr=Math.min(2,window.devicePixelRatio||1); W=w; cv.style.width=w+"px"; cv.style.height=w+"px"; cv.width=cv.height=Math.round(w*dpr); x.setTransform(dpr,0,0,dpr,0,0); redraw(); };
  function seg(s, from){ if(!s.pts.length) return; x.strokeStyle=s.c; x.fillStyle=s.c; x.lineWidth=Math.max(1,s.w*W); x.lineCap="round"; x.lineJoin="round";
    if(s.pts.length===1){ const [a,b]=s.pts[0]; x.beginPath(); x.arc(a*W,b*W,x.lineWidth/2,0,Math.PI*2); x.fill(); return; }
    x.beginPath(); const st=Math.max(0,from-1); x.moveTo(s.pts[st][0]*W,s.pts[st][1]*W); for(let i=st+1;i<s.pts.length;i++) x.lineTo(s.pts[i][0]*W,s.pts[i][1]*W); x.stroke(); }
  function redraw(){ x.fillStyle="#fff"; x.fillRect(0,0,W,W); pad.strokes.forEach(s=>seg(s,0)); }
  pad.redraw=redraw;
  pad.add=(id,c,w,pts)=>{ let s=pad.strokes.find(q=>q.id===id); if(!s){ s={id,c,w,pts:[]}; pad.strokes.push(s); } const from=s.pts.length; s.pts.push(...pts); seg(s,from); };
  pad.undo=()=>{ pad.strokes.pop(); redraw(); };
  pad.clear=()=>{ pad.strokes=[]; redraw(); };
  pad.load=strokes=>{ pad.strokes=strokes.map(s=>({...s,pts:[...s.pts]})); redraw(); };
  pad.jpeg=(px=320,q=.6)=>{ const c=document.createElement("canvas"); c.width=c.height=px; const y=c.getContext("2d"); y.fillStyle="#fff"; y.fillRect(0,0,px,px);
    pad.strokes.forEach(s=>{ y.strokeStyle=s.c; y.fillStyle=s.c; y.lineWidth=Math.max(1,s.w*px); y.lineCap="round"; y.lineJoin="round"; y.beginPath();
      if(s.pts.length===1){ y.arc(s.pts[0][0]*px,s.pts[0][1]*px,y.lineWidth/2,0,7); y.fill(); return; } s.pts.forEach(([a,b],i)=>i?y.lineTo(a*px,b*px):y.moveTo(a*px,b*px)); y.stroke(); });
    let out=c.toDataURL("image/jpeg",q); if(out.length>22000) out=c.toDataURL("image/jpeg",.4); return out; };
  if(editable){
    let cur=null;
    const pt=e=>{ const r=cv.getBoundingClientRect(); return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))].map(v=>Math.round(v*1000)/1000); };
    cv.addEventListener("pointerdown",e=>{ e.preventDefault(); cv.setPointerCapture?.(e.pointerId); const p=pt(e); cur={id:myId+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), c:pad.color, w:pad.width, pts:[]}; pad.strokes.push(cur); cur.pts.push(p); seg(cur,0); onBegin&&onBegin(cur,p); });
    cv.addEventListener("pointermove",e=>{ if(!cur) return; e.preventDefault(); const p=pt(e), l=cur.pts[cur.pts.length-1]; if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])<.003) return; cur.pts.push(p); seg(cur,cur.pts.length-1); onPoint&&onPoint(cur,p); });
    const up=()=>{ cur=null; }; cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up); cv.addEventListener("pointerleave",up);
    pad.doUndo=()=>{ pad.undo(); onUndo&&onUndo(); };
    pad.doClear=()=>{ pad.clear(); onClear&&onClear(); };
  }
  size(); const ro=new ResizeObserver(()=>{ if(Math.round(box.clientWidth)!==W) size(); }); ro.observe(box); pad.stop=()=>ro.disconnect();
  return pad;
}

function qStart(){ const D=dr, ps=drPlayers(); D.order=ps.map(p=>p.id); D.names={}; ps.forEach(p=>D.names[p.id]=p.name);
  track("draw_game_started",{mode:"quick",players:ps.length}); D.turnIdx=-1; drSend({t:"q_begin",names:D.names}); qNextTurn(); }
function qNextTurn(){ const D=dr; const present=new Set(drPlayers().map(p=>p.id));
  do{ D.turnIdx++; }while(D.turnIdx<D.order.length && !present.has(D.order[D.turnIdx]));
  if(D.turnIdx>=D.order.length) return drHostSend({t:"q_over",best:D.best||null});
  drHostSend({t:"q_turn",n:D.turnIdx+1,total:D.order.length,drawer:D.order[D.turnIdx],bank:D.aiWords.length>=3?D.aiWords:null,names:D.names}); }
function qWordChoices(bank){ return bank&&bank.length>=3 ? shuffle(bank).slice(0,3) : freshOrder("drawWords",DRAW_WORDS).slice(0,3); }
function onDrawMsg(m){
  const D=dr;
  if(m.t==="lobby"){ D.mode=m.mode||"quick"; if(D.view!=="lobby"){ D.view="lobby"; } renderDraw(); return; }
  // ----- quick
  if(m.t==="q_begin"){ D.scores={}; D.names=m.names||D.names; D.best=null; return; }
  if(m.t==="q_turn"){ if(D.turn&&D.turn.n===m.n&&D.view!=="lobby") return; if(m.names) D.names=m.names; clearInterval(D.tick); clearInterval(D.flushT);
    D.turn={n:m.n,total:m.total,drawer:m.drawer,bank:m.bank,guessed:[],word:null,len:null}; D.chat=[]; D.guessTimer=null; D.myCorrect=false; D.pad?.stop?.(); D.pad=null; D.view=m.drawer===myId?"q_choose":"q_wait"; if(m.drawer===myId) D.choices=qWordChoices(m.bank); renderDraw(); return; }
  if(m.t==="q_start"){ if(!D.turn||m.n!==D.turn.n) return; D.turn.hint=m.hint; D.turn.left=m.dur; if(D.turn.drawer!==myId){ D.view="q_guess"; renderDraw(); } return; }
  if(m.t==="s"){ if(D.turn&&D.turn.drawer===m.from&&m.from!==myId&&D.pad) (m.list||[]).forEach(s=>D.pad.add(s.id,s.c,s.w,s.pts)); return; }
  if(m.t==="undo"){ if(D.turn&&m.from!==myId&&D.pad) D.pad.undo(); return; }
  if(m.t==="clear"){ if(D.turn&&m.from!==myId&&D.pad) D.pad.clear(); return; }
  if(m.t==="guess"){ if(!D.turn||D.turn.drawer!==myId||m.n!==D.turn.n||!D.turn.word) return; qCheckGuess(m.from,m.text); return; }
  if(m.t==="chat"){ if(!D.turn||m.n!==D.turn.n) return; D.chat.push({who:m.who,text:m.text}); qChat(); return; }
  if(m.t==="q_correct"){ if(!D.turn||m.n!==D.turn.n||D.turn.guessed.includes(m.who)) return; D.turn.guessed.push(m.who);
    D.scores[m.who]=(D.scores[m.who]||0)+m.pts; D.scores[D.turn.drawer]=(D.scores[D.turn.drawer]||0)+m.dpts;
    D.chat.push({sys:true,text:`🎉 ${drName(m.who)} зөв таалаа! +${m.pts}`}); qChat(); if(m.who===myId){ D.view="q_guess"; D.myCorrect=true; renderDraw(); } beep(990,.12,.12); buzz(30); return; }
  if(m.t==="q_end"){ if(!D.turn||m.n!==D.turn.n||D.view==="q_end") return; clearInterval(D.tick); clearInterval(D.flushT); D.turn.word=m.word; D.turn.img=m.img; D.view="q_end";
    if(m.img && (!D.best || D.turn.guessed.length>=D.best.g)) D.best={img:m.img, word:m.word, g:D.turn.guessed.length, by:D.turn.drawer};
    renderDraw(); beep(660,.25,.12); if(D.host){ clearTimeout(D.nextT); D.nextT=setTimeout(()=>{ if(dr===D) qNextTurn(); },5000); } return; }
  if(m.t==="q_over"){ if(D.view==="q_over") return; clearInterval(D.tick); D.view="q_over"; if(m.best) D.best=m.best; renderDraw(); beep(1200,.3,.15); buzz([60,40,200]); return; }
  // ----- chain
  if(m.t==="c_start"){ if(D.chain&&D.chain.step!=null&&D.view!=="lobby") return; D.chain={order:m.order,names:m.names,subs:{}}; D.names=m.names; return; }
  if(m.t==="c_fill"){ if(!D.chain) return; const t=D.chain.subs[m.step]||(D.chain.subs[m.step]={}); Object.entries(m.subs||{}).forEach(([k,v])=>{ if(!(k in t)) t[k]=v; }); return; }
  if(m.t==="c_step"){ if(!D.chain) return; if(D.chain.step===m.step) return; D.chain.step=m.step; D.chain.dur=m.dur; D.chain.done=false; D.view="c_step"; renderDraw(); return; }
  if(m.t==="c_sub"){ if(!D.chain) return; (D.chain.subs[m.step]||(D.chain.subs[m.step]={}))[m.chain]=m.data; if(D.host) cMaybeAdvance(); const el=document.getElementById("cProg"); if(el) el.textContent=cProgText(); return; }
  if(m.t==="c_reveal"){ if(!D.chain||(D.view==="c_reveal"&&D.chain.reveal===m.idx)) return; D.view="c_reveal"; D.chain.reveal=m.idx; renderDraw(); return; }
  if(m.t==="c_over"){ if(D.view==="c_over"||!D.chain) return; D.view="c_over"; renderDraw(); return; }
}
function qTimer(sec, el, onEnd){ const D=dr; clearInterval(D.tick); let left=sec; el&&(el.textContent=left);
  D.tick=setInterval(()=>{ if(dr!==D){ clearInterval(D.tick); return; } left--; const t=document.getElementById("qT"); if(t){ t.textContent=left; t.classList.toggle("low",left<=10); } if(left<=0){ clearInterval(D.tick); onEnd&&onEnd(); } },1000); }
function qChat(){ const box=document.getElementById("qChat"); if(!box||!dr) return; box.innerHTML=dr.chat.slice(-5).map(c=>`<div class="${c.sys?"sys":""}">${c.sys?esc(c.text):`<b>${esc(drName(c.who))}:</b> ${esc(c.text)}`}</div>`).join(""); }

function qBeginDraw(word){ const D=dr, T=D.turn; T.word=word; markSeen("drawWords",word); T.left=DRAW_SEC.draw; T.players=drPlayers().map(p=>p.id); D.myStrokes=[]; D.view="q_draw";

function cStart(){ const D=dr, ps=drPlayers().slice(0,8); const names={}; ps.forEach(p=>names[p.id]=p.name);

  D.cAdv=-1; drHostSend({t:"c_start",order:ps.map(p=>p.id),names}); cStep(0); }
const C_STEPS=[{k:"write",dur:DRAW_SEC.cwrite},{k:"draw",dur:DRAW_SEC.cdraw},{k:"guess",dur:DRAW_SEC.cguess}];
function cStep(step){ const D=dr; clearTimeout(D.stepT); if(step>=C_STEPS.length){ return cReveal(0); }
  const p={t:"c_step",step,dur:C_STEPS[step].dur}; drHostSend(p); D.stepT=setTimeout(()=>{ if(dr===D) cForce(step); },(C_STEPS[step].dur+6)*1000); }
function cForce(step){ cAdvanceFrom(step); }
function cMaybeAdvance(){ const D=dr, C=D.chain; if(C.step==null) return; const subs=C.subs[C.step]||{}; const present=new Set(drPlayers().map(p=>p.id));
  const need=C.order.map((id,j)=>cChainFor(j,C.step)).filter((ci,j)=>present.has(C.order[j])); if(need.every(ci=>ci in subs)) { const s=C.step; setTimeout(()=>{ if(dr===D) cAdvanceFrom(s); },400); } }
function cAdvanceFrom(s){ const D=dr; if(!D||!D.chain||D.cAdv>=s) return; D.cAdv=s; clearTimeout(D.stepT);
  const subs=D.chain.subs[s]||(D.chain.subs[s]={}), miss={}; D.chain.order.forEach((_,i)=>{ if(!(i in subs)) miss[i]=s===1?"":"(хоосон)"; });
  if(Object.keys(miss).length) drSend({t:"c_fill",step:s,subs:miss}); cStep(s+1); }
const cChainFor=(j,step)=>{ const n=dr.chain.order.length; return ((j-step)%n+n)%n; };
function cProgText(){ const C=dr.chain, subs=C.subs[C.step]||{}; return `${Object.keys(subs).length} / ${C.order.length} бэлэн`; }
function cSubmit(data){ const D=dr, C=D.chain; if(C.done) return; C.done=true; const j=C.order.indexOf(myId); const ci=cChainFor(j,C.step); clearInterval(D.tick);

function phCompress(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ const s=Math.min(1,480/Math.max(im.naturalWidth,im.naturalHeight)), w=Math.max(1,Math.round(im.naturalWidth*s)), h=Math.max(1,Math.round(im.naturalHeight*s));
    const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h); URL.revokeObjectURL(url);
    let out=c.toDataURL("image/jpeg",.65); if(out.length>60000) out=c.toDataURL("image/jpeg",.5); res(out); };
  im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); }; im.src=url; }); }

    const sh=document.getElementById("phShare"); if(sh) sh.onclick=async e=>{ const url=photoUrl(P.code); try{ if(navigator.share){ await navigator.share({title:"Хамтдаа · Зураг таах рулет",text:`Өрөөний код: ${P.code}`,url}); return; } }catch(err){ if(err&&err.name==="AbortError") return; } try{ await navigator.clipboard.writeText(url); e.target.textContent="✓ Линк хуулагдлаа"; }catch(err){ e.target.textContent=url; } };
    const st=document.getElementById("phStart"); if(st) st.onclick=()=>{ if(phCanStart()[0]) phStart(); };
    return;
  }
  const G=P.game, R=P.round, cnt=G&&R?`<p class="who-line" style="margin:0">Зураг ${R.r+1} / ${G.total}</p>`:"";
  if(P.view==="p_wait"){
    app.innerHTML=`<section class="view">${head}${cnt}<div class="ai-load"><div class="sp">📸</div><h2 style="font-size:22px">Дараагийн зураг ирж байна…</h2></div></section>`; return; }
  if(P.view==="p_show"){
    const mine=R.owner===myId, opts=G.players.filter(id=>id!==myId);
    app.innerHTML=`<section class="view dview">${head}<div class="dhead"><span>Зураг ${R.r+1} / ${G.total}</span><span class="dtimer" id="phT">${PH_SEC}</span></div>
      <img class="phimg" src="${R.img}" alt="" draggable="false">
      ${mine?`<p class="wait" style="margin:0;font-weight:800">Чиний зураг гарч байна — чимээгүй байгаарай 🤫</p>`
        :`<p class="who-line" style="margin:0">Хэний зураг вэ?</p><div class="phopts">${opts.map(id=>`<button class="phopt" data-who="${id}">${avHTML(phName(id),phPic(id),30)}<span>${esc(phName(id))}</span></button>`).join("")}</div>`}
      <p class="note" id="phProg" style="margin:0"></p></section>`;
    app.querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>{ if(R.my||R.timeUp) return; R.my=b.dataset.who; const ms=Math.round(performance.now()-R.t0);
      phSend({t:"p_guess",r:R.r,from:myId,who:R.my,ms}); app.querySelectorAll("[data-who]").forEach(x=>{ x.disabled=true; x.classList.toggle("on",x===b); }); beep(700,.06,.08); buzz(15);
      const pg=document.getElementById("phProg"); if(pg) pg.textContent="✓ Таамаг илгээгдлээ"; });
    clearInterval(P.tick); let left=PH_SEC; P.tick=setInterval(()=>{ if(ph!==P||P.round!==R){ clearInterval(P.tick); return; } left--; const t=document.getElementById("phT"); if(t){ t.textContent=Math.max(0,left); t.classList.toggle("low",left<=3); }
      if(left<=3&&left>0) beep(500,.05,.06); if(left<=0){ clearInterval(P.tick); R.timeUp=true; app.querySelectorAll("[data-who]").forEach(x=>x.disabled=true); } },1000);
    return;
  }
  if(P.view==="p_result"){
    const res=R.res, fast=res.correct[0], me=res.correct.find(c=>c.id===myId), rows=Object.entries(P.scores).map(([id,v])=>[phName(id),v,id]).sort((a,b)=>b[1]-a[1]);
    const myLine = R.owner===myId ? `🤫 Чиний зураг байлаа · ${res.correct.length} хүн таалаа` : me ? `🎉 Та зөв таалаа! +${me.pts}` : R.my ? "😅 Буруу таалаа" : "⏰ Та таамаг өгсөнгүй";
    app.innerHTML=`<section class="view">${head}${cnt}
      ${res.skipped?`<div class="ai-load"><div class="sp" style="animation:none">📵</div><h2 style="font-size:22px">Зураг ирсэнгүй</h2><p class="wait">${esc(phName(R.owner))} холболтоо шалгаарай</p></div>`:`<img class="phimg sm" src="${R.img}" alt="" draggable="false">
      <div class="hero" style="text-align:center"><span class="eyebrow">📸 Зургийн эзэн</span><h1 style="margin-top:6px;display:flex;gap:10px;align-items:center;justify-content:center">${avHTML(phName(R.owner),phPic(R.owner),44)}${esc(phName(R.owner))}</h1>
      <p style="margin:0">${fast?`⚡ Хамгийн хурдан: <b>${esc(phName(fast.id))}</b> (${(fast.ms/1000).toFixed(1)}с, +${fast.pts})`:"Хэн ч таасангүй 🙈"}</p><p style="margin:4px 0 0;font-weight:800">${myLine}</p></div>`}
      ${tallyHTML(rows)}<p class="wait" style="margin:0">${R.r+1<G.total?"Дараагийн зураг удахгүй…":"Үр дүн гарч байна…"}</p></section>`;
    return;
  }
  if(P.view==="p_over"){
    const rows=Object.entries(P.scores).map(([id,v])=>[phName(id),v,id]).sort((a,b)=>b[1]-a[1]); while(rows.length<3) rows.push(["—",0,""]);
    const pod=(r,place,h)=>`<div class="pod"><div>${r[2]?avHTML(r[0],phPic(r[2]),place===1?64:48):""}</div><b>${esc(r[0])}</b><span class="pts">${r[1]} оноо</span><div class="pst" style="height:${h}px">${place}</div></div>`;
    app.innerHTML=`<section class="view">${head}<div class="hero" style="text-align:center"><span class="eyebrow">📸 Зураг таах рулет · Дууслаа</span><h1 style="margin-top:6px">👑 ${esc(rows[0][0])}</h1></div>
      <div class="podium">${pod(rows[1],2,70)}${pod(rows[0],1,100)}${pod(rows[2],3,50)}</div>
      ${tallyHTML(rows.filter(r=>r[2]))}
      <p class="note" style="margin:0">🔒 Бусдын зургууд таны утаснаас устгагдсан.</p>
      <div class="row" style="margin-top:auto;flex-direction:column"><button class="btn story" id="st">📸 Story зураг хадгалах</button>${P.host?`<button class="btn" id="phAgain">Дахин тоглох</button>`:""}</div></section>`;
    const top=rows[0]; const rest=rows.slice(1,3).filter(r=>r[2]).map((r,i)=>`${i+2}-р: ${r[0]} (${r[1]})`).join(" · ");
    document.getElementById("st").onclick=()=>shareStory({game:"Зураг таах рулет", ic:"📸", who:{name:top[0],pic:top[2]?phPic(top[2]):""}, big:top[0], line:`${top[1]} оноо`, sub:rest||`${Object.keys(P.scores).length} тоглогч`});
    const ag=document.getElementById("phAgain"); if(ag) ag.onclick=()=>phHostSend({t:"p_lobby"});
    beep(1200,.3,.15); buzz([60,40,200]);
  }
}
function phStart(){
  const P=ph, ps=phPlayers().slice(0,PH_MAX_PLAYERS), ready=ps.filter(phReady);
  const pools=ready.map(p=>({id:p.id, idx:shuffle([...Array(Math.min(p.n,PH_MAX_PICS)).keys()])})), order=[]; let last=null;
  while(order.length<PH_ROUNDS && pools.some(q=>q.idx.length)){
    const cand=shuffle(pools.filter(q=>q.idx.length)).sort((a,b)=>b.idx.length-a.idx.length), q=cand.find(c=>c.id!==last)||cand[0];
    order.push({owner:q.id, idx:q.idx.pop()}); last=q.id; }
  const names={}; ps.forEach(p=>names[p.id]=p.name);
  P.order=order; track("photo_game_started",{players:ps.length, rounds:order.length});
  phHostSend({t:"p_begin", players:ps.map(p=>p.id), names, total:order.length});
  phNext(0);
}
function phNext(r){ const P=ph; if(!P) return; clearTimeout(P.nextT); clearTimeout(P.reqT); clearTimeout(P.endT);
  if(r>=P.order.length){ phHostSend({t:"p_over", scores:P.scores}); return; }
  const o=P.order[r]; phHostSend({t:"p_req", r, owner:o.owner, idx:o.idx});
  P.reqT=setTimeout(()=>{ if(ph===P && P.round && P.round.r===r && !P.round.img) phEndRound(r,true); },6000); }
function phMaybeEnd(){ const P=ph, R=P.round; if(!R||R.ended||!R.img) return; const present=new Set(phPlayers().map(p=>p.id));
  const need=P.game.players.filter(id=>id!==R.owner && present.has(id)); if(need.every(id=>R.guesses[id])) setTimeout(()=>phEndRound(R.r),300); }
function phEndRound(r, skipped){ const P=ph, R=P&&P.round; if(!R||R.r!==r||R.ended) return; R.ended=true; clearTimeout(P.endT); clearTimeout(P.reqT);
  const correct=Object.entries(R.guesses).filter(([id,g])=>g.who===R.owner).map(([id,g])=>({id, ms:g.ms, pts:Math.max(100,Math.min(200,Math.round(200-100*g.ms/(PH_SEC*1000))))})).sort((a,b)=>a.ms-b.ms);
  const scores={...P.scores}; correct.forEach(c=>{ scores[c.id]=(scores[c.id]||0)+c.pts; });
  phHostSend({t:"p_result", r, owner:R.owner, correct, scores, skipped:!!skipped});
  P.nextT=setTimeout(()=>{ if(ph===P) phNext(r+1); }, skipped?2500:5000); }
function onPhotoMsg(m){
  const P=ph;
  if(m.t==="p_lobby"){ if(P.view==="lobby") return; clearInterval(P.tick); P.view="lobby"; P.game=null; P.round=null; P.last=null; renderPhoto(); return; }
  if(m.t==="p_begin"){ P.game={players:m.players, total:m.total}; P.names={...P.names, ...m.names}; P.scores={}; P.round=null; P.sentR=null; return; }
  if(m.t==="p_req"){ if(!P.game||(P.round&&P.round.r>=m.r)) return; clearInterval(P.tick);
    P.round={r:m.r, owner:m.owner, img:null, guesses:{}, my:null}; P.view="p_wait";
    if(m.owner===myId && P.photos[m.idx] && P.sentR!==m.r){ P.sentR=m.r; phSend({t:"p_img", r:m.r, owner:myId, img:P.photos[m.idx]}); }
    renderPhoto(); return; }
  if(m.t==="p_img"){ const R=P.round; if(!R||m.r!==R.r||R.img||R.ended) return; R.img=m.img; R.t0=performance.now(); P.view="p_show"; renderPhoto(); beep(880,.08,.1);
    if(P.host){ clearTimeout(P.reqT); clearTimeout(P.endT); P.endT=setTimeout(()=>{ if(ph===P) phEndRound(m.r); },(PH_SEC+1)*1000); } return; }
  if(m.t==="p_guess"){ const R=P.round; if(!R||m.r!==R.r||R.ended||R.guesses[m.from]||m.from===R.owner) return; R.guesses[m.from]={who:m.who, ms:Math.max(0,+m.ms||0)};
    const pg=document.getElementById("phProg"); if(pg && R.owner===myId) pg.textContent=`${Object.keys(R.guesses).length} хүн таамаглалаа`;
    if(P.host) phMaybeEnd(); return; }
  if(m.t==="p_result"){ const R=P.round; if(!R||m.r!==R.r||P.view==="p_result") return; clearInterval(P.tick); R.ended=true; R.res=m; P.scores=m.scores||{}; P.view="p_result"; renderPhoto();
    const me=(m.correct||[]).some(c=>c.id===myId); if(me){ beep(990,.12,.12); buzz(30); } else beep(440,.15,.08); return; }
  if(m.t==="p_over"){ if(P.view==="p_over"||!P.game) return; clearInterval(P.tick); P.scores=m.scores||P.scores; P.round=null; P.view="p_over"; renderPhoto(); return; }
}


/* ---------- «ℹ️ Яаж тоглох вэ?» short rules ---------- */
let curGame=null;
const HOW = {
  spy:"Утсыг дамжуулж үгээ нууцаар хар. Бүгд ижил үгтэй, ганц тагнуул л өөр үгтэй. Ээлжээр нэг нэг сэжүүр хэлээд тагнуулыг санал хураан ол.",
  bomb:"Гарсан сэдэвт тохирох үг хэлээд утсаа хажуугийн хүнд дамжуул. Сэдэв 20 секунд тутам өөрөө солигдоно. Хэний гарт дэлбэрнэ, тэр хүн хожигдоно.",
  familyDeck:"Уур амьсгалаа сонгоод картыг ээлжээр чанга уншиж, бүгдээрээ хариулна. 10 карт тутамд жижиг дулаан даалгавар гарна.",
  missions:"Хүн бүр утсаа ганцаараа хараад нууц даалгавраа авна. Оройн турш баригдалгүй биелүүл. Төгсгөлд хэн хэдийг биелүүлснийг тоолно.",
  match:"Эхлээд нэг нь бүх асуултад өөрийнхөө тухай нууцаар хариулна. Дараа нь нөгөө нь бүгдийг нь таана. Төгсгөлд хэдэн хувь таарсныг харна.",
  wish:"Хоёулаа ээлжээр санаа бүрийг нууцаар ❤️ / 🤔 / ✕ гэж тэмдэглэнэ. Төгсгөлд зөвхөн хоёулаа хүссэн зүйлс гарна.",
  nandin:"Карт бүр дээр нэг нь асууж, нөгөө нь хариулна. 10 карт тутамд дулаахан үйлдэл хийгээд хүсвэл үргэлжлүүлнэ.",
  spicy:"Ээлжээр халуухан асуултад үнэнээр хариул. Ичвэл шийтгэл биелүүл. 10 тойрог тутамд хамгийн зоригтойг тодруулна.",
  shagai:"Ээлжээр утсаа аваад «Сэгсрэх» дар. Дөрвөн бэрх 20, морь 4, тэмээ 3, хонь 2, ямаа 1 оноо. Бүгд шидэж дуусахад хамгийн их оноотой нь хожно.",
  wave:f=>`Нэг нь нууц цэгийг хараад тэр цэгт тохирох ганц үг хэлнэ. ${f==="couples"?"Нөгөө нь":"Бусад нь ярилцаж"} зүүг тэр цэг рүү тааруулна. Ойртох тусам оноо их.`,
  whisper:"Утас барьсан хүн нууц асуултыг ганцаараа уншаад, хариулт болох хүний нэрийг чанга хэлнэ. Нэрлэгдсэн хүн асуултыг мэдмээр бол зоос шиднэ.",
  room:"Нэг хүн өрөө нээнэ, бусад нь кодоор утаснаасаа нэгдэнэ. Асуулт гарахад тохирох хүнийхээ нэр дээр нууцаар санал өгнө.",
  draw:"Нэг хүн өрөө нээнэ, бусад нь кодоор нэгдэнэ. Нэг нь утсан дээрээ зурна, бусад нь юу болохыг бичиж таана.",
  photo:"Нэг хүн өрөө нээнэ, бусад нь кодоор нэгдэнэ. Хүн бүр 3–5 зураг сонгоно. Гарсан зураг хэнийх болохыг хамгийн хурдан таасан нь хожно."
};
function applyHow(){
  if(!curGame || !HOW[curGame]) return;
  const ol=app.querySelector(".view > ol.rules"); if(!ol) return;
  const t=typeof HOW[curGame]==="function"?HOW[curGame](curFrom):HOW[curGame];
  const box=document.createElement("div"); box.className="howto";
  box.innerHTML=`<b>ℹ️ Яаж тоглох вэ?</b><p>${esc(t)}</p><details class="howmore"><summary>Дэлгэрэнгүй дүрэм</summary></details>`;
  ol.replaceWith(box); box.querySelector("details").appendChild(ol);
}
new MutationObserver(applyHow).observe(app,{childList:true});

/* ---------- Routing ---------- */
function startGame(id, from){
  curFrom=from; curGame=id;
  if(id==="familyDeck") familyTalk(from); else if(DECKS[id]) deck(id,from); else if(id==="spy") spySetup(from); else if(id==="headsup") huPick(from,false); else if(id==="charades") huPick(from,true); else if(id==="bomb") bomb(from); else if(id==="missions") missions(from); else if(id==="match") match(from); else if(id==="wish") wish(from); else if(id==="picker") picker(from); else if(id==="shagai") shagai(from); else if(id==="wave") wave(from); else if(id==="nandin") nandin(from); else if(id==="spicy") spicy(from); else if(id==="wheel") wheel(from); else if(id==="whisper") whisper(from); else if(id==="ai") aiDeck(from); else if(id==="room") roomMenu(from); else if(id==="draw") drawMenu(from); else if(id==="photo") photoMenu(from); else return false;
  return true;
}
function nav(hash){ if(location.hash===hash) route(); else location.hash=hash; }
function route(){
  document.querySelectorAll(".touchpad,.boom,.studio").forEach(el=>el.remove());
  curGame=null; gate.hidden=true; stopTimer(); leaveRoom(); leaveDraw(); leavePhoto(); aiRerender=null; closeUserMenu();
  const r=location.hash.replace(/^#\/?/,"").split("/");
  try{ gtag("event","page_view",{page_title:document.title, page_location:location.href, page_path:location.pathname+location.hash}); }catch(e){}
  if(r[0]==="mood" && MOODS[r[1]]) mood(r[1]);
  else if(r[0]==="privacy") privacy();
  else if(r[0]==="guide") guide();
  else if(r[0]==="room") { roomMenu("friends", /^\d{4}$/.test(r[1]||"")?r[1]:""); track("game_start",{game_id:"room", mood:"friends"}); }
  else if(r[0]==="draw") { const c=/^\d{4}$/.test(r[1]||"")?r[1]:""; drawMenu("friends", c, r[2]==="go"); track("game_start",{game_id:"draw", mood:"friends"}); }
  else if(r[0]==="photo") { const c=/^\d{4}$/.test(r[1]||"")?r[1]:""; photoMenu("friends", c, r[2]==="go"); track("game_start",{game_id:"photo", mood:"friends"}); }
  else if(r[0]==="game" && GAMES[r[1]] && MOODS[r[2]] && startGame(r[1],r[2])) track("game_start",{game_id:r[1], mood:r[2]});
  else home();
  window.scrollTo({top:0,behavior:"instant"});
}
// every screen swap inside a game starts at the top too
new MutationObserver(()=>{ if(window.scrollY>0) window.scrollTo({top:0,behavior:"instant"}); }).observe(app,{childList:true});
app.addEventListener("click", e=>{
  const go=e.target.closest("[data-go]"), m=e.target.closest("[data-mood]"), g=e.target.closest("[data-game]");
  if(e.target.closest("[data-snd]")){ toggleSound(); return; }
  const gh=e.target.closest("[data-go-hash]"); if(gh){ nav(gh.dataset.goHash); return; }
  if(go){ const v=go.dataset.go; nav(v==="home" ? "#/" : "#/mood/"+v.slice(5)); }
  else if(m) nav("#/mood/"+m.dataset.mood);
  else if(g) nav("#/game/"+g.dataset.game+"/"+g.dataset.from);
});
window.addEventListener("hashchange", route);
route();
initAuth();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
